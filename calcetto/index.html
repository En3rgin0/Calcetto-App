<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#06110c">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="description" content="Il registro dei vostri calcetti: statistiche, carte e overall da 64 a 99.">
  <meta property="og:title" content="Calcetto Club">
  <meta property="og:description" content="Statistiche, carte e overall da 64 a 99 per i vostri calcetti.">
  <meta property="og:image" content="https://subtle-choux-50ba6f.netlify.app/og-cover.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Calcetto Club</title>
  <style>
    /* ================= Design system ================= */
    :root {
      color-scheme: dark;
      --bg: #06110c;
      --bg2: #0b1a13;
      --card: #0f2219;
      --card2: #142c21;
      --raise: #1a3628;
      --line: rgba(255, 255, 255, .08);
      --line2: rgba(255, 255, 255, .14);
      --tx: #eef8f1;
      --mut: #8ba899;
      --mut2: #5f7c6d;
      --acc: #3ddc84;
      --acc-ink: #03210f;
      --acc-soft: rgba(61, 220, 132, .14);
      --acc2: #f5c542;
      --acc2-ink: #2a1d00;
      --acc2-soft: rgba(245, 197, 66, .14);
      --red: #ff6b6b;
      --red-soft: rgba(255, 107, 107, .12);
      --blue: #4f8ff7;
      --orange: #fb8b3c;
      --r-sm: 10px;
      --r: 14px;
      --r-lg: 20px;
      --r-xl: 28px;
      --sh-1: 0 1px 2px rgba(0, 0, 0, .3);
      --sh-2: 0 8px 24px rgba(0, 0, 0, .35);
      --sh-3: 0 20px 50px rgba(0, 0, 0, .5);
      --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      --nav-h: 64px;
      --side-w: 248px;
      --gut: 16px;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%
    }

    html,
    body {
      margin: 0;
      background: var(--bg);
      color: var(--tx);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.45
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(1200px 600px at 80% -10%, rgba(61, 220, 132, .10), transparent 60%), radial-gradient(900px 500px at -10% 110%, rgba(245, 197, 66, .06), transparent 60%), var(--bg);
      background-attachment: fixed
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
      color: inherit
    }

    button {
      border: 0;
      cursor: pointer;
      background: none;
      touch-action: manipulation
    }

    a {
      color: inherit
    }

    img {
      max-width: 100%
    }

    :focus-visible {
      outline: 2px solid var(--acc);
      outline-offset: 2px
    }

    ::selection {
      background: var(--acc);
      color: var(--acc-ink)
    }

    b,
    strong {
      font-weight: 700
    }

    h1 {
      font-size: clamp(24px, 4vw, 32px);
      line-height: 1.15;
      letter-spacing: -.02em;
      margin: 4px 0 16px;
      font-weight: 800
    }

    h2 {
      font-size: 13px;
      margin: 28px 0 10px;
      font-weight: 700;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .08em
    }

    h3 {
      margin: 0
    }

    .i {
      width: 20px;
      height: 20px;
      flex: none;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
      vertical-align: middle
    }

    .i.sm {
      width: 16px;
      height: 16px
    }

    .mut {
      color: var(--mut);
      font-size: 13px
    }

    .lnk,
    .chk a {
      color: var(--acc);
      text-decoration: none;
      font-weight: 600
    }

    .lnk:hover,
    .chk a:hover {
      text-decoration: underline
    }

    .num,
    .ov,
    .stat b,
    .score,
    .fc-ovr,
    .fc-stats,
    .cv,
    .vote {
      font-variant-numeric: tabular-nums
    }

    /* ================= Form ================= */
    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--mut);
      letter-spacing: .04em;
      margin-top: 6px
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: var(--r-sm);
      border: 1px solid var(--line2);
      background: var(--bg2);
      color: var(--tx);
      margin: 6px 0 12px;
      transition: border-color .15s, box-shadow .15s;
      font-size: 16px
    }

    input:focus,
    select:focus,
    textarea:focus {
      outline: 0;
      border-color: var(--acc);
      box-shadow: 0 0 0 3px var(--acc-soft)
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--mut2)
    }

    input[type=file] {
      padding: 10px;
      font-size: 14px
    }

    textarea {
      min-height: 110px;
      resize: vertical;
      line-height: 1.5
    }

    select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, var(--mut) 50%), linear-gradient(135deg, var(--mut) 50%, transparent 50%);
      background-position: calc(100% - 18px) 50%, calc(100% - 13px) 50%;
      background-size: 5px 5px;
      background-repeat: no-repeat;
      padding-right: 36px
    }

    .chk {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      text-align: left;
      font-size: 14px;
      color: var(--tx);
      margin: 16px 0;
      font-weight: 400;
      letter-spacing: 0
    }

    .chk input {
      width: 22px;
      height: 22px;
      margin: 0;
      flex: none;
      accent-color: var(--acc)
    }

    /* ================= Bottoni ================= */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      width: 100%;
      padding: 12px 18px;
      margin-bottom: 8px;
      border-radius: var(--r);
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      text-align: center;
      background: var(--acc);
      color: var(--acc-ink);
      box-shadow: 0 6px 18px rgba(61, 220, 132, .22);
      transition: transform .12s var(--ease), filter .15s, background .15s, box-shadow .15s
    }

    .btn:active {
      transform: scale(.98)
    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed;
      box-shadow: none
    }

    .btn.sec {
      background: var(--card2);
      color: var(--tx);
      border: 1px solid var(--line);
      box-shadow: none
    }

    .btn.danger {
      background: transparent;
      color: var(--red);
      border: 1px solid rgba(255, 107, 107, .45);
      box-shadow: none
    }

    .btn.sm {
      width: auto;
      min-height: 38px;
      padding: 8px 14px;
      font-size: 13px;
      border-radius: var(--r-sm);
      margin-bottom: 0
    }

    .btn.icon {
      width: 42px;
      min-height: 42px;
      padding: 0;
      flex: none
    }

    @media (hover:hover) {
      .btn:hover {
        filter: brightness(1.07)
      }

      .btn.sec:hover {
        background: var(--raise);
        border-color: var(--line2);
        filter: none
      }

      .btn.danger:hover {
        background: var(--red-soft);
        filter: none
      }
    }

    .row {
      display: flex;
      gap: 8px;
      align-items: center
    }

    .row>* {
      flex: 1;
      min-width: 0
    }

    .sp {
      justify-content: space-between
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px
    }

    .actions .btn {
      width: auto;
      flex: 1 1 auto;
      margin: 0
    }

    /* ================= Superfici ================= */
    .box {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r-lg);
      padding: 16px;
      margin-bottom: 12px
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--acc2-soft);
      color: var(--acc2);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .06em;
      padding: 3px 7px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
      white-space: nowrap
    }

    .badge.g {
      background: rgba(79, 143, 247, .16);
      color: #8db6ff
    }

    .badge.r {
      background: var(--red-soft);
      color: var(--red)
    }

    .demo {
      background: var(--acc2-soft);
      border: 1px solid rgba(245, 197, 66, .3);
      color: #ffe08a;
      border-radius: var(--r);
      padding: 10px 14px;
      font-size: 13px;
      margin-bottom: 14px
    }

    .empty-state {
      text-align: center;
      padding: 36px 16px;
      border: 1px dashed var(--line2);
      border-radius: var(--r-lg);
      color: var(--mut);
      margin: 8px 0 12px
    }

    .empty-state b {
      display: block;
      font-size: 30px;
      margin-bottom: 6px
    }

    /* ================= Shell: navigazione ================= */
    #app {
      min-height: 100vh;
      min-height: 100dvh
    }

    .shell {
      min-height: 100vh;
      min-height: 100dvh
    }

    .main {
      padding: calc(env(safe-area-inset-top) + 12px) var(--gut) calc(var(--nav-h) + env(safe-area-inset-bottom) + 28px)
    }

    .page {
      max-width: 640px;
      margin: 0 auto
    }

    .page:not(.still) {
      animation: pageIn .28s var(--ease)
    }

    @keyframes pageIn {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 15;
      height: calc(var(--nav-h) + env(safe-area-inset-bottom));
      padding-bottom: env(safe-area-inset-bottom);
      background: rgba(8, 20, 14, .86);
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: center
    }

    @supports (backdrop-filter:blur(1px)) {
      .nav {
        background: rgba(8, 20, 14, .72);
        backdrop-filter: saturate(1.4) blur(16px);
        -webkit-backdrop-filter: saturate(1.4) blur(16px)
      }
    }

    .nav .brand,
    .nav .nav-foot {
      display: none
    }

    .nav-items {
      display: flex;
      width: 100%;
      max-width: 520px
    }

    .nav-items button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      color: var(--mut);
      font-size: 11px;
      font-weight: 600;
      position: relative;
      transition: color .15s
    }

    .nav-items button .i {
      width: 22px;
      height: 22px;
      transition: transform .2s var(--ease)
    }

    .nav-items button.on {
      color: var(--acc)
    }

    .nav-items button.on .i {
      transform: translateY(-1px)
    }

    .nav-items button.on::before {
      content: "";
      position: absolute;
      top: 0;
      width: 28px;
      height: 3px;
      border-radius: 0 0 3px 3px;
      background: var(--acc)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 17px;
      letter-spacing: -.01em
    }

    .brand img {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      box-shadow: var(--sh-1)
    }

    /* ================= Login ================= */
    .login {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(env(safe-area-inset-top) + 24px) var(--gut) calc(env(safe-area-inset-bottom) + 24px)
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      text-align: center;
      animation: pageIn .4s var(--ease)
    }

    .login .logo img {
      width: 88px;
      height: 88px;
      border-radius: 24px;
      box-shadow: 0 14px 40px rgba(0, 0, 0, .5), 0 0 0 1px var(--line2)
    }

    .login h1 {
      margin: 18px 0 8px;
      font-size: 34px
    }

    .login .lead {
      color: var(--mut);
      margin: 0 0 22px;
      font-size: 15px
    }

    .login .box {
      text-align: left;
      font-size: 13px
    }

    .login ul {
      margin: 8px 0 0;
      padding-left: 18px;
      color: var(--mut)
    }

    .login li {
      margin: 3px 0
    }

    .loading {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      color: var(--mut)
    }

    .spin {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      border: 3px solid var(--line2);
      border-top-color: var(--acc);
      animation: spin .8s linear infinite
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    /* ================= Profilo ================= */
    .me-side {
      display: flex;
      flex-direction: column;
      align-items: stretch
    }

    .hello {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px
    }

    .hello h1 {
      margin-bottom: 6px
    }

    .hello .mut {
      margin: 0 0 14px
    }

    /* ================= Statistiche ================= */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(102px, 1fr));
      gap: 8px
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 12px 8px;
      text-align: center;
      min-width: 0
    }

    .stat b {
      display: block;
      font-size: 21px;
      font-weight: 800;
      letter-spacing: -.01em;
      white-space: nowrap
    }

    .stat span {
      display: block;
      font-size: 10.5px;
      color: var(--mut);
      text-transform: uppercase;
      letter-spacing: .06em;
      margin-top: 2px;
      font-weight: 600
    }

    .stat.hl b {
      color: var(--acc2)
    }

    .stat.tap {
      cursor: pointer;
      border-color: rgba(61, 220, 132, .45);
      background: linear-gradient(160deg, rgba(61, 220, 132, .16), var(--card));
      transition: transform .12s var(--ease)
    }

    .stat.tap:active {
      transform: scale(.97)
    }

    @media (hover:hover) {
      .stat.tap:hover {
        border-color: var(--acc)
      }
    }

    /* ================= Carta giocatore ================= */
    .fcard {
      width: 236px;
      margin: 8px auto 18px;
      border-radius: 24px 24px 64px 64px/24px 24px 40px 40px;
      padding: 18px 18px 24px;
      position: relative;
      box-shadow: 0 18px 40px rgba(0, 0, 0, .55), inset 0 0 0 3px rgba(255, 255, 255, .2);
      overflow: hidden;
      isolation: isolate
    }

    .fcard::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(115deg, transparent 30%, rgba(255, 255, 255, .28) 48%, transparent 62%);
      pointer-events: none;
      z-index: 2;
      background-size: 220% 100%;
      animation: shine 6s ease-in-out infinite
    }

    @keyframes shine {

      0%,
      60% {
        background-position: 120% 0
      }

      100% {
        background-position: -120% 0
      }
    }

    .fc-top {
      display: flex;
      gap: 6px;
      align-items: flex-end
    }

    .fc-ovr {
      font-size: 46px;
      font-weight: 900;
      line-height: .9;
      letter-spacing: -.03em
    }

    .fc-ovr small {
      display: block;
      font-size: 15px;
      font-weight: 800;
      margin-top: 6px;
      letter-spacing: .02em
    }

    .fc-av {
      flex: 1;
      height: 112px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 76px
    }

    .fc-av img {
      height: 112px;
      width: 112px;
      object-fit: cover;
      border-radius: 50%;
      border: 3px solid rgba(255, 255, 255, .35)
    }

    .fc-name {
      text-align: center;
      font-weight: 900;
      font-size: 19px;
      text-transform: uppercase;
      letter-spacing: .02em;
      margin: 8px 0 6px;
      border-bottom: 2px solid rgba(0, 0, 0, .18);
      padding-bottom: 6px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .fc-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      text-align: center;
      font-weight: 800;
      font-size: 17px
    }

    .fc-stats span {
      display: block;
      font-size: 10px;
      font-weight: 700;
      opacity: .75;
      letter-spacing: .04em
    }

    .fc-num {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 13px;
      font-weight: 800;
      opacity: .7
    }

    /* ================= Liste ================= */
    .list {
      display: flex;
      flex-direction: column;
      gap: 8px
    }

    .pl {
      display: flex;
      align-items: center;
      gap: 12px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 10px 12px;
      min-height: 62px;
      transition: background .15s, border-color .15s, transform .12s var(--ease)
    }

    .pl[onclick] {
      cursor: pointer
    }

    .pl[onclick]:active {
      transform: scale(.99)
    }

    @media (hover:hover) {
      .pl[onclick]:hover {
        background: var(--card2);
        border-color: var(--line2)
      }
    }

    .pl .rk {
      width: 24px;
      color: var(--mut);
      font-weight: 800;
      text-align: center;
      font-variant-numeric: tabular-nums;
      flex: none
    }

    .pl .rk.p1 {
      color: #f5c542
    }

    .pl .rk.p2 {
      color: #c9d2db
    }

    .pl .rk.p3 {
      color: #e0a26b
    }

    .pl .ov {
      min-width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 18px;
      color: #1b1400;
      background: linear-gradient(135deg, #fbe58a, #d9a21b);
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, .15);
      flex: none
    }

    .pl .av {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg2);
      border: 1px solid var(--line);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 21px;
      overflow: hidden;
      flex: none
    }

    .pl .av img {
      width: 100%;
      height: 100%;
      object-fit: cover
    }

    .pl .nm {
      flex: 1;
      min-width: 0
    }

    .pl .nm b {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-size: 15px
    }

    .pl .nm .mut {
      display: block;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .pl .chev {
      color: var(--mut2)
    }

    .pl .cols {
      display: none
    }

    .cards {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      align-items: start
    }

    .cards>.box {
      margin: 0
    }

    .rank-head {
      display: none
    }

    /* ================= Lega ================= */
    .lhead {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px
    }

    .lhead .grow {
      flex: 1
    }

    .code-chip {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 14px;
      border-radius: 999px;
      background: var(--card2);
      border: 1px solid var(--line);
      font-size: 13px;
      color: var(--mut);
      font-weight: 600;
      white-space: nowrap
    }

    .code-chip b {
      color: var(--tx);
      letter-spacing: .12em;
      font-size: 14px
    }

    @media (hover:hover) {
      .code-chip:hover {
        border-color: var(--line2);
        background: var(--raise)
      }
    }

    .ltitle {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
      margin: 10px 0 14px
    }

    .ltitle h1 {
      margin: 0
    }

    .seg {
      position: sticky;
      top: calc(env(safe-area-inset-top) + 8px);
      z-index: 10;
      display: flex;
      background: rgba(11, 26, 19, .88);
      border-radius: var(--r);
      padding: 4px;
      margin: 0 0 16px;
      border: 1px solid var(--line);
      box-shadow: var(--sh-2)
    }

    @supports (backdrop-filter:blur(1px)) {
      .seg {
        background: rgba(11, 26, 19, .7);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px)
      }
    }

    .seg button {
      flex: 1;
      padding: 10px 4px;
      font-size: 13px;
      border-radius: calc(var(--r) - 4px);
      color: var(--mut);
      font-weight: 700;
      transition: background .2s var(--ease), color .2s;
      white-space: nowrap
    }

    .seg button.on {
      background: var(--acc);
      color: var(--acc-ink)
    }

    @media (hover:hover) {
      .seg button:not(.on):hover {
        color: var(--tx);
        background: var(--card2)
      }
    }

    .next {
      display: flex;
      gap: 14px;
      align-items: center;
      background: linear-gradient(135deg, rgba(61, 220, 132, .16), rgba(61, 220, 132, .04));
      border: 1px solid rgba(61, 220, 132, .3)
    }

    .next .day {
      flex: none;
      width: 58px;
      height: 62px;
      border-radius: var(--r);
      background: var(--acc);
      color: var(--acc-ink);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1
    }

    .next .day b {
      font-size: 24px;
      font-weight: 900
    }

    .next .day span {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      margin-top: 3px
    }

    .tl {
      font-weight: 800;
      color: var(--acc);
      margin-bottom: 4px;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .06em
    }

    .tl.b {
      color: var(--orange)
    }

    /* partite */
    .match {
      content-visibility: auto;
      contain-intrinsic-size: auto 260px
    }

    .match .mh {
      font-size: 12.5px;
      color: var(--mut);
      display: flex;
      flex-wrap: wrap;
      gap: 4px 12px
    }

    .match .score {
      font-size: 34px;
      font-weight: 900;
      text-align: center;
      margin: 8px 0 10px;
      letter-spacing: .02em;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px
    }

    .match .score i {
      font-style: normal;
      color: var(--mut2);
      font-weight: 400
    }

    .match .score .wa {
      color: var(--blue)
    }

    .match .score .wb {
      color: var(--orange)
    }

    .match .teams {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      font-size: 13.5px;
      background: var(--bg2);
      border-radius: var(--r);
      padding: 12px
    }

    .match .teams div div {
      padding: 3px 0
    }

    .match .teams .tl {
      color: var(--blue)
    }

    .match .teams .tl.b {
      color: var(--orange)
    }

    .rep {
      margin-top: 14px;
      border-top: 1px solid var(--line);
      padding-top: 14px
    }

    .rep p {
      margin: 6px 0 12px;
      white-space: pre-wrap;
      line-height: 1.55;
      font-size: 14.5px
    }

    .mvp {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--acc2-soft);
      border: 1px solid rgba(245, 197, 66, .35);
      color: #ffe08a;
      border-radius: var(--r-sm);
      padding: 9px 12px;
      font-size: 13.5px;
      margin-bottom: 10px
    }

    .vl {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 8px 0;
      border-bottom: 1px solid var(--line);
      font-size: 13.5px
    }

    .vl:last-child {
      border-bottom: 0
    }

    .vl b {
      white-space: nowrap
    }

    .vl .cm {
      color: var(--mut);
      flex: 1;
      min-width: 0;
      overflow-wrap: anywhere
    }

    .vote {
      display: inline-block;
      min-width: 38px;
      text-align: center;
      border-radius: 8px;
      padding: 3px 6px;
      font-weight: 800;
      font-size: 13px;
      color: #06210f;
      flex: none
    }

    .vb-hi {
      background: #3ddc84
    }

    .vb-mid {
      background: #f5c542;
      color: #2a1d00
    }

    .vb-lo {
      background: #ff7b7b;
      color: #2b0505
    }

    .vb-no {
      background: var(--bg2);
      color: var(--mut)
    }

    .more {
      margin: 8px 0 4px
    }

    .more summary {
      cursor: pointer;
      list-style: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--acc);
      font-weight: 700;
      font-size: 13.5px;
      padding: 8px 2px
    }

    .more summary::-webkit-details-marker {
      display: none
    }

    .more summary::before {
      content: "";
      width: 7px;
      height: 7px;
      border: solid currentColor;
      border-width: 0 2px 2px 0;
      transform: rotate(-45deg);
      transition: transform .2s
    }

    .more[open] summary::before {
      transform: rotate(45deg)
    }

    .more .list {
      margin-top: 4px
    }

    .fxd {
      font-weight: 800;
      font-size: 17px;
      margin: 10px 0 2px
    }

    .fxd::first-letter {
      text-transform: uppercase
    }

    .fxn {
      margin: 10px 0 0;
      font-size: 14px;
      padding: 10px 12px;
      background: var(--bg2);
      border-radius: var(--r-sm)
    }

    /* FAB */
    .fab {
      position: fixed;
      right: max(var(--gut), env(safe-area-inset-right));
      bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);
      z-index: 14;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: var(--acc2);
      color: var(--acc2-ink);
      font-weight: 800;
      padding: 0 20px 0 16px;
      height: 54px;
      border-radius: 999px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .45), 0 0 0 1px rgba(255, 255, 255, .15) inset;
      transition: transform .15s var(--ease)
    }

    .fab:active {
      transform: scale(.96)
    }

    /* ================= Modali ================= */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .62);
      z-index: 30;
      display: flex;
      align-items: flex-end;
      justify-content: center
    }

    .modal.anim {
      animation: fade .2s ease
    }

    .modal>div {
      position: relative;
      background: var(--bg2);
      width: 100%;
      max-width: 600px;
      max-height: 92vh;
      max-height: 92dvh;
      overflow: auto;
      overscroll-behavior: contain;
      border-radius: var(--r-xl) var(--r-xl) 0 0;
      padding: 26px 18px calc(22px + env(safe-area-inset-bottom));
      border: 1px solid var(--line2);
      border-bottom: 0;
      box-shadow: var(--sh-3)
    }

    .modal.anim>div {
      animation: sheetIn .32s var(--ease)
    }

    .modal>div::before {
      content: "";
      position: absolute;
      top: 9px;
      left: 50%;
      width: 40px;
      height: 4px;
      margin-left: -20px;
      border-radius: 4px;
      background: var(--line2)
    }

    .modal>div>h2:first-of-type {
      padding-right: 40px;
      margin-top: 4px;
      font-size: 21px;
      color: var(--tx);
      text-transform: none;
      letter-spacing: -.01em;
      font-weight: 800
    }

    .modal-x {
      position: absolute;
      top: 14px;
      right: 14px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--mut);
      background: var(--card2);
      z-index: 2
    }

    @media (hover:hover) {
      .modal-x:hover {
        color: var(--tx);
        background: var(--raise)
      }
    }

    @keyframes fade {
      from {
        opacity: 0
      }
    }

    @keyframes sheetIn {
      from {
        transform: translateY(40px);
        opacity: .4
      }
    }

    @keyframes popIn {
      from {
        transform: translateY(10px) scale(.98);
        opacity: 0
      }
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 14px
    }

    .chip {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: var(--card);
      border: 2px solid var(--line);
      font-size: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: border-color .15s, transform .12s
    }

    .chip.on {
      border-color: var(--acc);
      background: var(--acc-soft)
    }

    .chip:active,
    .sw:active {
      transform: scale(.92)
    }

    .sw {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 3px solid transparent;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2);
      transition: transform .12s
    }

    .sw.on {
      border-color: #fff;
      box-shadow: 0 0 0 3px var(--acc-soft)
    }

    .pick {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 8px;
      align-items: center;
      padding: 9px 0;
      border-bottom: 1px solid var(--line)
    }

    @media (max-width:519px) {
      .pick {
        grid-template-columns: auto 1fr 1fr;
        row-gap: 6px
      }

      .pick>b {
        grid-column: 1/-1
      }

      .pick .st {
        justify-content: flex-end
      }
    }

    .tg {
      display: flex;
      border: 1px solid var(--line2);
      border-radius: 10px;
      overflow: hidden
    }

    .tg button {
      background: var(--card);
      padding: 8px 12px;
      color: var(--mut);
      font-weight: 800;
      min-width: 38px
    }

    .tg button.on.a {
      background: var(--blue);
      color: #fff
    }

    .tg button.on.b {
      background: var(--orange);
      color: #fff
    }

    .st {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 12px
    }

    .st button {
      background: var(--card2);
      border: 1px solid var(--line);
      width: 30px;
      height: 30px;
      border-radius: 9px;
      font-weight: 800
    }

    .st span {
      min-width: 16px;
      text-align: center;
      font-weight: 700
    }

    .rp {
      padding: 10px 0;
      border-bottom: 1px solid var(--line)
    }

    .rp .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px
    }

    .rp input {
      margin: 8px 0 0
    }

    .stv {
      display: flex;
      align-items: center;
      gap: 6px
    }

    .stv button {
      background: var(--card2);
      border: 1px solid var(--line);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 18px
    }

    .stv span {
      min-width: 38px;
      text-align: center;
      font-weight: 800;
      font-size: 17px
    }

    .scorebar {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      text-align: center
    }

    .scorebar b {
      font-size: 32px;
      font-weight: 900;
      font-variant-numeric: tabular-nums
    }

    .scorebar .tl {
      color: var(--blue);
      margin: 0
    }

    .scorebar .tl.b {
      color: var(--orange)
    }

    .scorebox {
      position: sticky;
      top: -26px;
      z-index: 3;
      background: var(--card2)
    }

    /* calendario */
    .calh {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 14px 0 10px
    }

    .calh button {
      background: var(--card2);
      border: 1px solid var(--line);
      width: 42px;
      height: 42px;
      border-radius: 12px;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .calh b {
      text-transform: capitalize;
      font-size: 16px
    }

    .cal {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px
    }

    .cal .dw {
      text-align: center;
      font-size: 11px;
      color: var(--mut);
      padding: 2px 0;
      font-weight: 700
    }

    .cd {
      min-height: 58px;
      border-radius: 10px;
      background: var(--card);
      padding: 5px 2px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px
    }

    .cd.empty {
      background: none
    }

    .cd .dn {
      font-size: 12px;
      color: var(--mut2)
    }

    .cd.has {
      background: var(--card2);
      border: 1px solid var(--line2);
      cursor: pointer
    }

    .cd.has .dn {
      color: var(--tx);
      font-weight: 700
    }

    .cd.sel {
      outline: 2px solid var(--acc);
      outline-offset: -1px
    }

    .cv {
      font-weight: 900;
      font-size: 15px
    }

    .cd .mv {
      font-size: 11px;
      line-height: 1
    }

    .v-hi {
      color: #3ddc84
    }

    .v-mid {
      color: #f5c542
    }

    .v-lo {
      color: #ff7b7b
    }

    .v-no {
      color: var(--mut)
    }

    /* toast */
    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);
      transform: translateX(-50%);
      background: #f4fbf6;
      color: #0b1a13;
      padding: 12px 18px;
      border-radius: 999px;
      z-index: 50;
      font-weight: 700;
      font-size: 14px;
      max-width: calc(100% - 32px);
      box-shadow: var(--sh-3);
      animation: toastIn .3s var(--ease);
      text-align: center
    }

    @keyframes toastIn {
      from {
        opacity: 0;
        transform: translate(-50%, 12px)
      }
    }

    /* ================= Tablet (≥ 768px) ================= */
    @media (min-width:768px) {
      :root {
        --gut: 28px
      }

      .page {
        max-width: 760px
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }

      .cards.one {
        grid-template-columns: 1fr
      }

      .modal {
        align-items: center;
        padding: 24px
      }

      .modal>div {
        border-radius: var(--r-xl);
        border-bottom: 1px solid var(--line2);
        max-height: 88vh;
        padding: 28px 26px 24px
      }

      .modal.anim>div {
        animation: popIn .26s var(--ease)
      }

      .modal>div::before {
        display: none
      }

      .fcard {
        width: 256px
      }

      .me-grid {
        display: grid;
        grid-template-columns: 280px minmax(0, 1fr);
        gap: 28px;
        align-items: start
      }

      .me-grid>* {
        min-width: 0
      }

      .me-main .lgrid {
        grid-template-columns: minmax(0, 1fr)
      }

      .me-side {
        position: sticky;
        top: 20px
      }

      .me-side h2:first-child,
      .me-main h2:first-child {
        margin-top: 0
      }

      .lgrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px
      }
    }

    /* ================= Desktop (≥ 1024px): barra laterale ================= */
    @media (min-width:1024px) {
      :root {
        --gut: 40px
      }

      .main {
        margin-left: var(--side-w);
        padding-top: 32px;
        padding-bottom: 48px
      }

      .page {
        max-width: 1080px
      }

      .nav {
        top: 0;
        right: auto;
        width: var(--side-w);
        height: auto;
        bottom: 0;
        flex-direction: column;
        justify-content: flex-start;
        padding: 24px 14px;
        border-top: 0;
        border-right: 1px solid var(--line);
        background: rgba(8, 20, 14, .6)
      }

      .nav .brand {
        display: flex;
        padding: 0 10px 26px
      }

      .nav-items {
        flex-direction: column;
        max-width: none;
        gap: 4px
      }

      .nav-items button {
        flex: none;
        flex-direction: row;
        justify-content: flex-start;
        gap: 12px;
        padding: 12px 14px;
        border-radius: 12px;
        font-size: 14px
      }

      .nav-items button.on {
        background: var(--acc-soft)
      }

      .nav-items button.on::before {
        top: 50%;
        left: -14px;
        width: 3px;
        height: 22px;
        margin-top: -11px;
        border-radius: 0 3px 3px 0
      }

      .nav-items button:not(.on):hover {
        background: var(--card);
        color: var(--tx)
      }

      .nav .nav-foot {
        display: block;
        margin-top: auto;
        padding: 14px 10px 0;
        border-top: 1px solid var(--line);
        font-size: 13px;
        color: var(--mut)
      }

      .nav-foot b {
        display: block;
        color: var(--tx);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis
      }

      .nav-foot span {
        display: block;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        margin-bottom: 10px
      }

      .fab {
        bottom: 32px;
        right: 40px
      }

      .only-mobile {
        display: none !important
      }

      .toast {
        bottom: 32px;
        left: calc(50% + var(--side-w)/2)
      }

      .seg {
        top: 12px
      }

      .me-grid {
        grid-template-columns: 300px minmax(0, 1fr);
        gap: 40px
      }

      .lgrid {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }

      .fxgrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px
      }

      .fxgrid>.box {
        margin: 0
      }

      /* classifica a tabella */
      .pl.rank .cols {
        display: grid;
        grid-template-columns: repeat(6, 60px);
        text-align: center;
        gap: 4px;
        font-weight: 700;
        font-variant-numeric: tabular-nums
      }

      .pl.rank .nm .mut {
        display: none
      }

      .pl.rank-head {
        display: flex;
        background: none;
        border: 0;
        min-height: 0;
        padding-top: 0;
        padding-bottom: 2px;
        font-size: 11px;
        color: var(--mut);
        text-transform: uppercase;
        letter-spacing: .06em;
        font-weight: 700
      }

      .pl.rank-head .av,
      .pl.rank-head .ov {
        visibility: hidden;
        height: 0
      }

      .pl.rank-head .cols {
        font-weight: 700
      }
    }

    @media (min-width:1280px) {
      .me-main .lgrid {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    @media (min-width:1400px) {
      .cards {
        grid-template-columns: repeat(3, minmax(0, 1fr))
      }

      .cards.two {
        grid-template-columns: repeat(2, minmax(0, 1fr))
      }
    }

    /* ================= Accessibilità ================= */
    @media (prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
        scroll-behavior: auto !important
      }
    }
  </style>
</head>

    /* ---------------- Statistiche e overall ---------------- */
    const OV_MIN = 64, OV_MAX = 99;
    const clampOv = x => Math.max(OV_MIN, Math.min(OV_MAX, x));
    function calcOverall(s) {
      const n = s.played; if (!n) return OV_MIN;
      const perf = 0.35 * ((s.wins + 0.5 * s.draws) / n)
        + 0.35 * Math.min(s.goals / n / 2, 1)
        + 0.30 * Math.min(s.assists / n / 1.2, 1);
      const f = 0.8 * perf * Math.min(1, n / 10) + 0.2 * Math.min(n / 40, 1);
      return clampOv(Math.round(OV_MIN + (OV_MAX - OV_MIN) * f));
    }
    const ADJ = ['wins', 'draws', 'losses', 'goals', 'assists'];
    const emptyStats = () => ({ played: 0, wins: 0, draws: 0, losses: 0, goals: 0, assists: 0 });
    function computeStats(matches) {
      const out = {}; const get = id => out[id] || (out[id] = emptyStats());
      for (const m of matches) {
        const sa = m.A.reduce((t, p) => t + (+p.g || 0), 0), sb = m.B.reduce((t, p) => t + (+p.g || 0), 0);
        for (const [team, my, op] of [[m.A, sa, sb], [m.B, sb, sa]]) {
          for (const p of team) {
            const s = get(p.id); s.played++; s.goals += +p.g || 0; s.assists += +p.a || 0;
            if (my > op) s.wins++; else if (my === op) s.draws++; else s.losses++;
          }
        }
      }
      return out;
    }
    const finalize = s => ({
      ...s, winPct: s.played ? Math.round(100 * s.wins / s.played) : 0,
      gpm: s.played ? s.goals / s.played : 0, apm: s.played ? s.assists / s.played : 0, ovr: calcOverall(s)
    });
    const f1 = x => (Math.round(x * 10) / 10).toFixed(1);

    /* Statistiche finali di ogni giocatore della lega =
       calcolo dalle partite + correzioni manuali dell'admin (adj, ovrAdj) */
    function mvpIds(m) {
      const r = m.report && m.report.ratings; if (!r) return [];
      const v = [...m.A, ...m.B].map(p => ({ id: p.id, v: r[p.id] && typeof r[p.id].v === 'number' ? r[p.id].v : null })).filter(x => x.v != null);
      if (!v.length) return [];
      const best = Math.max(...v.map(x => x.v)); return v.filter(x => x.v === best).map(x => x.id);
    }
    function leagueStats(lid) {
      const { members, matches } = S.cache[lid], base = computeStats(matches), out = {}, rs = {}, mv = {};
      for (const mt of matches) {
        for (const id of mvpIds(mt)) mv[id] = (mv[id] || 0) + 1;
        const r = mt.report && mt.report.ratings; if (!r) continue;
        for (const [pid, x] of Object.entries(r)) if (x && typeof x.v === 'number') { const q = rs[pid] || (rs[pid] = { sum: 0, n: 0 }); q.sum += x.v; q.n++; }
      }
      for (const m of members) {
        const b = base[m.id] || emptyStats(), a = m.adj || {}, s = emptyStats();
        for (const k of ADJ) s[k] = Math.max(0, (b[k] || 0) + (+a[k] || 0));
        s.played = s.wins + s.draws + s.losses;
        const f = finalize(s); f.autoOvr = f.ovr; f.ovr = clampOv(f.ovr + (+m.ovrAdj || 0)); f.base = b; const q = rs[m.id] || { sum: 0, n: 0 }; f.rsum = q.sum; f.rn = q.n; f.avg = q.n ? q.sum / q.n : null; f.mvp = mv[m.id] || 0;
        out[m.id] = f;
      }
      return out;
    }

    /* ---------------- Utility ---------------- */
    const $ = s => document.querySelector(s);
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    /* argomento sicuro dentro onclick="..." (stringa JS + escape HTML) */
    const q = v => esc(JSON.stringify(String(v ?? '')));

    const safePhoto = p => typeof p === 'string' && p.length < 150000 && /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(p) ? p : '';

    const toast = t => { const e = document.createElement('div'); e.className = 'toast'; e.textContent = t; document.body.appendChild(e); setTimeout(() => e.remove(), 2600); };
    const THEMES = {
      gold: { bg: 'linear-gradient(145deg,#f9e27d,#d9a21b 60%,#b57b0a)', fg: '#3b2a00' },
      silver: { bg: 'linear-gradient(145deg,#f4f6f8,#aeb7c2 60%,#8893a0)', fg: '#1e252d' },
      bronze: { bg: 'linear-gradient(145deg,#e9b37a,#b4672c 60%,#8a4513)', fg: '#2d1503' },
      black: { bg: 'linear-gradient(145deg,#3a3a44,#15151b 60%,#050507)', fg: '#f5d76e' },
      blue: { bg: 'linear-gradient(145deg,#7cc4ff,#2a6fdb 60%,#14378f)', fg: '#fff' },
      green: { bg: 'linear-gradient(145deg,#8cf2a8,#1fa35a 60%,#0b5b30)', fg: '#04210f' },
      purple: { bg: 'linear-gradient(145deg,#d0a2ff,#7a3ee0 60%,#3f1b86)', fg: '#fff' },
      red: { bg: 'linear-gradient(145deg,#ff9a8a,#d9322a 60%,#7f0f0a)', fg: '#fff' },
    };
    const EMOJIS = ['⚽', '🧤', '🦁', '🐺', '🦅', '🔥', '⚡', '👑', '🐐', '🚀', '🦈', '🐯'];
    const POS = ['POR', 'DIF', 'CEN', 'ATT'];
    const defCard = name => ({ nick: (name || '').split(' ')[0].slice(0, 12), pos: 'ATT', num: 10, emoji: '⚽', photo: '', theme: 'gold' });
    /* Un giocatore di lega: uid = account collegato (null = senza account) */
    const norm = m => ({ ...m, uid: m.uid !== undefined ? m.uid : (m.guest ? null : m.id), adj: m.adj || {}, ovrAdj: +m.ovrAdj || 0, card: m.card || defCard(m.name) });
    const newGuest = name => ({ id: 'g_' + uid() + uid(), uid: null, name, guest: true, card: defCard(name), adj: {}, ovrAdj: 0 });

    /* ---------------- Storage: Locale (demo) e Firebase ---------------- */
    const Local = {
      load() { try { return JSON.parse(localStorage.getItem('cc_db')) || { users: {}, leagues: {}, members: {}, matches: {} } } catch { return { users: {}, leagues: {}, members: {}, matches: {} } } },
      save(d) { localStorage.setItem('cc_db', JSON.stringify(d)); },
      async getUser(id) { return this.load().users[id] || null },
      async setUser(id, u) { const d = this.load(); d.users[id] = { ...d.users[id], ...u }; this.save(d); },
      async leaguesOf(id) { return Object.values(this.load().leagues).filter(l => l.memberIds.includes(id)) },
      async saveLeague(l) { const d = this.load(); d.leagues[l.id] = l; this.save(d); },
      async findByCode(c) { return Object.values(this.load().leagues).find(l => l.code === c) || null },
      async members(l) { return Object.values(this.load().members[l] || {}) },
      async setMember(l, m) { const d = this.load(); (d.members[l] = d.members[l] || {})[m.id] = m; this.save(d); },
      async patchMember(l, id, f) { const d = this.load(); const m = (d.members[l] = d.members[l] || {})[id] || { id }; d.members[l][id] = Object.assign(m, f); this.save(d); },
      async delMember(l, id) { const d = this.load(); delete (d.members[l] || {})[id]; this.save(d); },
      async getLeague(id) { return this.load().leagues[id] || null },
      async patchLeague(id, f) { const d = this.load(); Object.assign(d.leagues[id], f); this.save(d); },
      async delLeague(l) { const d = this.load(); delete d.leagues[l]; delete d.members[l]; delete d.matches[l]; if (d.fixtures) delete d.fixtures[l]; this.save(d); },
      async matches(l) { return Object.values(this.load().matches[l] || {}) },
      async saveMatch(l, m) { const d = this.load(); (d.matches[l] = d.matches[l] || {})[m.id] = m; this.save(d); },
      async delMatch(l, id) { const d = this.load(); delete (d.matches[l] || {})[id]; this.save(d); },
      async fixtures(l) { return Object.values((this.load().fixtures || {})[l] || {}) },
      async saveFixture(l, f) { const d = this.load(); d.fixtures = d.fixtures || {}; (d.fixtures[l] = d.fixtures[l] || {})[f.id] = f; this.save(d); },
      async delFixture(l, id) { const d = this.load(); if (d.fixtures && d.fixtures[l]) delete d.fixtures[l][id]; this.save(d); },
      async joinByCode(c, u) { const d = this.load(), l = Object.values(d.leagues).find(x => x.code === c); if (!l) return null; if (!l.memberIds.includes(u)) l.memberIds.push(u); this.save(d); return l; },
      async addAdmin(lid, u) { const d = this.load(), l = d.leagues[lid]; if (!l.admins.includes(u)) l.admins.push(u); this.save(d); },
      async removeAdmin(lid, u) { const d = this.load(), l = d.leagues[lid]; l.admins = l.admins.filter(x => x !== u); this.save(d); },
      async kick(lid, u) { const d = this.load(), l = d.leagues[lid]; l.memberIds = l.memberIds.filter(x => x !== u); l.admins = l.admins.filter(x => x !== u); this.save(d); },
      async codeFree(c) { return !Object.values(this.load().leagues).some(l => l.code === c) },
      async ensureCode() { return true },
      async setCode(lid, code) { await this.patchLeague(lid, { code }) },
    };
    let DB = Local, fb = null;
    async function initFirebase() {
      const V = '10.12.2', base = `https://www.gstatic.com/firebasejs/${V}/`;
      const [app, auth, fs] = await Promise.all([import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
      const a = app.initializeApp(FIREBASE_CONFIG), au = auth.getAuth(a);
      let db;   /* cache locale: avvio più veloce e meno letture; se il browser non la supporta si usa quella in memoria */
      try { db = fs.initializeFirestore(a, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) }); }
      catch (e) { console.warn(e); db = fs.getFirestore(a); }
      fb = { auth, au, fs };
      const { doc, getDoc, setDoc, updateDoc, getDocs, collection, query, where, deleteDoc, writeBatch, arrayUnion, arrayRemove } = fs;
      DB = {
        async getUser(id) { const s = await getDoc(doc(db, 'users', id)); return s.exists() ? s.data() : null },
        async setUser(id, u) { await setDoc(doc(db, 'users', id), u, { merge: true }) },
        async leaguesOf(id) { const s = await getDocs(query(collection(db, 'leagues'), where('memberIds', 'array-contains', id))); return s.docs.map(d => d.data()) },
        async saveLeague(l) { await setDoc(doc(db, 'leagues', l.id), l) },
        /* Ingresso con codice: codes/{CODICE} → id lega. Nello stesso batch si scrive la "prova" joins/{uid} con il codice,
           che le regole confrontano con quello della lega: senza codice giusto non si entra. */
        async joinByCode(c, u) {
          const s = await getDoc(doc(db, 'codes', c)); if (!s.exists()) return null;
          const lid = s.data().lid, b = writeBatch(db);
          b.set(doc(db, 'leagues', lid, 'joins', u), { code: c, ts: Date.now() });
          b.update(doc(db, 'leagues', lid), { memberIds: arrayUnion(u) });
          await b.commit(); return this.getLeague(lid);
        },
        async addAdmin(lid, u) { await updateDoc(doc(db, 'leagues', lid), { admins: arrayUnion(u) }) },
        async removeAdmin(lid, u) { await updateDoc(doc(db, 'leagues', lid), { admins: arrayRemove(u) }) },
        async kick(lid, u) { await updateDoc(doc(db, 'leagues', lid), { memberIds: arrayRemove(u), admins: arrayRemove(u) }) },
        async codeFree(c) { return !(await getDoc(doc(db, 'codes', c))).exists() },
        /* leghe create prima di questa versione: l'admin registra il codice in codes/ al primo accesso */
        async ensureCode(l) { const r = doc(db, 'codes', l.code), s = await getDoc(r); if (!s.exists()) { await setDoc(r, { lid: l.id }); return true; } return s.data().lid === l.id; },
        async setCode(lid, code, old) {
          await updateDoc(doc(db, 'leagues', lid), { code }); await setDoc(doc(db, 'codes', code), { lid });
          if (old) await deleteDoc(doc(db, 'codes', old)).catch(e => console.warn(e));
        },
        async members(l) { const s = await getDocs(collection(db, 'leagues', l, 'members')); return s.docs.map(d => d.data()) },
        async setMember(l, m) { await setDoc(doc(db, 'leagues', l, 'members', m.id), m) },
        async patchMember(l, id, f) { await setDoc(doc(db, 'leagues', l, 'members', id), f, { merge: true }) },
        async delMember(l, id) { await deleteDoc(doc(db, 'leagues', l, 'members', id)) },
        async getLeague(id) { const s = await getDoc(doc(db, 'leagues', id)); return s.exists() ? s.data() : null },
        async patchLeague(id, f) { await setDoc(doc(db, 'leagues', id), f, { merge: true }) },
        async delLeague(l) {
          const lg = await this.getLeague(l);
          for (const sub of ['matches', 'fixtures', 'members', 'joins']) { const s = await getDocs(collection(db, 'leagues', l, sub)).catch(() => ({ docs: [] })); await Promise.all(s.docs.map(d => deleteDoc(d.ref))); }
          if (lg && lg.code) await deleteDoc(doc(db, 'codes', lg.code)).catch(e => console.warn(e));
          await deleteDoc(doc(db, 'leagues', l));
        },
        async matches(l) { const s = await getDocs(collection(db, 'leagues', l, 'matches')); return s.docs.map(d => d.data()) },
        async saveMatch(l, m) { await setDoc(doc(db, 'leagues', l, 'matches', m.id), m) },
        async delMatch(l, id) { await deleteDoc(doc(db, 'leagues', l, 'matches', id)) },
        async fixtures(l) { const s = await getDocs(collection(db, 'leagues', l, 'fixtures')); return s.docs.map(d => d.data()) },
        async saveFixture(l, f) { await setDoc(doc(db, 'leagues', l, 'fixtures', f.id), f) },
        async delFixture(l, id) { await deleteDoc(doc(db, 'leagues', l, 'fixtures', id)) },
      };
    }

    /* ---------------- Stato ---------------- */
    const S = { user: null, me: null, tab: 'me', leagues: [], cache: {}, league: null, ltab: 'rank', modal: null, draft: null, agg: null, ready: false };
    const lm = () => S.cache[S.league.id];

    /* ---------------- Auth ---------------- */
    async function boot() {
      if (FIREBASE_CONFIG) {
        await initFirebase();
        fb.auth.onAuthStateChanged(fb.au, async u => {
          if (u) await afterLogin({ uid: u.uid, name: u.displayName || 'Giocatore', email: u.email, photo: u.photoURL });

    window.login = async () => {
      const cb = $('#pv'); if (cb && !cb.checked) return toast("Per continuare accetta l'informativa sulla privacy");
      try { sessionStorage.setItem('cc_pv', '1'); } catch { }
      if (FIREBASE_CONFIG) {
        try { await fb.auth.signInWithPopup(fb.au, new fb.auth.GoogleAuthProvider()); }
        catch (e) { if (String(e.code).includes('popup')) await fb.auth.signInWithRedirect(fb.au, new fb.auth.GoogleAuthProvider()); else toast('Login non riuscito'); }
      } else {
        const name = prompt('Modalità demo: come ti chiami?'); if (!name) return;
        const u = { uid: 'u_' + name.toLowerCase().replace(/\W+/g, '') + uid().slice(0, 3), name, email: name + '@demo.local' };
        localStorage.setItem('cc_session', JSON.stringify(u)); await afterLogin(u);
      }
    };

      if (FIREBASE_CONFIG) await fb.auth.signOut(fb.au); else localStorage.removeItem('cc_session');
      Object.assign(S, { user: null, me: null, leagues: [], cache: {}, league: null, tab: 'me', modal: null }); render();
    };
    async function afterLogin(u) {
      S.user = u;
      let me = await DB.getUser(u.uid);
      if (!me) { me = { uid: u.uid, name: u.name, email: u.email, card: defCard(u.name) }; await DB.setUser(u.uid, me); }
      let acc = false; try { acc = sessionStorage.getItem('cc_pv') === '1'; sessionStorage.removeItem('cc_pv'); } catch { }
      if ((!me.privacy || me.privacy.v !== PRIVACY_V) && acc) { me.privacy = { v: PRIVACY_V, ts: Date.now() }; await DB.setUser(u.uid, { privacy: me.privacy }); }
      S.me = me; await loadHome();
      if (!me.privacy || me.privacy.v !== PRIVACY_V) S.modal = { type: 'privacy' };
      S.ready = true; render();
    }
    window.acceptPrivacy = async () => {
      const privacy = { v: PRIVACY_V, ts: Date.now() };
      try { await DB.setUser(S.user.uid, { privacy }); } catch (e) { console.error(e); return toast('Errore, riprova'); }
      S.me.privacy = privacy; S.modal = null; await loadHome(); render();
    };
    async function loadHome() {
      S.leagues = await DB.leaguesOf(S.user.uid);
      await Promise.all(S.leagues.map(l => loadLeague(l.id)));   /* in parallelo, non una lega alla volta */
      summarize(); checkCodes();
    }
    function summarize() {
      const tot = emptyStats(), adjs = []; let rs = 0, rn = 0, mvp = 0;
      for (const l of S.leagues) {
        const m = myMember(l.id); if (!m) continue;
        const st = leagueStats(l.id)[m.id];
        for (const k of ['played', ...ADJ]) tot[k] += st[k];
        adjs.push(m.ovrAdj || 0); rs += st.rsum; rn += st.rn; mvp += st.mvp;
      }
      S.agg = finalize(tot); S.agg.rn = rn; S.agg.avg = rn ? rs / rn : null; S.agg.mvp = mvp;
      if (adjs.length) S.agg.ovr = clampOv(S.agg.ovr + Math.round(adjs.reduce((a, b) => a + b, 0) / adjs.length));
      /* se sono dentro una lega ma non ho ancora un giocatore → chiedi se collegarne uno esistente */
      if (!S.modal) { const p = S.leagues.find(l => !myMember(l.id)); if (p) S.modal = { type: 'claimAsk', lid: p.id }; }
    }
    async function loadLeague(id) {
      const [members, matches, fixtures] = await Promise.all([DB.members(id), DB.matches(id), DB.fixtures(id).catch(() => [])]);
      matches.sort((a, b) => (b.date + b.time).localeCompare(a.date + a.time));
      S.cache[id] = { members: members.map(norm), matches, fixtures };
    }
    /* dopo una modifica ricarica solo la lega toccata, non tutte */
    async function refresh(lid) {
      const l = await DB.getLeague(lid).catch(() => null);
      if (l && l.memberIds.includes(S.user.uid)) { await loadLeague(lid); S.leagues = S.leagues.map(x => x.id === lid ? l : x); }
      else { S.leagues = S.leagues.filter(x => x.id !== lid); delete S.cache[lid]; }
      summarize(); S.league = S.leagues.find(x => x.id === lid) || null;

    async function freeCode() { for (let i = 0; i < 8; i++) { const c = mkCode(); if (await DB.codeFree(c)) return c; } throw new Error('codice'); }
    /* leghe create prima dei codici in codes/: l'admin li registra in automatico (una volta per sessione) */

     ${KOFI_URL ? `<h2>Sostieni il progetto</h2><p class="mut">L'app è gratuita e senza pubblicità. Se ti piace, puoi offrirmi un caffè.</p><a class="btn sec" href="${esc(KOFI_URL)}" target="_blank" rel="noopener">${ic('coffee')}Offrimi un caffè su Ko-fi</a>` : ''}

    function ranking() {
      const members = lm().members.filter(m => !m.removed), st = leagueStats(S.league.id);
      return members.map(m => ({ m, s: st[m.id] })).sort((a, b) => b.s.ovr - a.s.ovr || b.s.goals - a.s.goals || a.m.name.localeCompare(b.m.name));

    function avatar(m) { const c = m.card || {}, ph = safePhoto(c.photo); return `<div class="av">${ph ? `<img src="${ph}" alt="">` : safeEmoji(c.emoji)}</div>`; }
    const scoreOf = m => [m.A.reduce((t, p) => t + (+p.g || 0), 0), m.B.reduce((t, p) => t + (+p.g || 0), 0)];
    const vClass = v => v >= 7 ? 'hi' : v >= 6 ? 'mid' : 'lo';
    const fmtV = v => String(+(+v).toFixed(1));
    function matchHead(m) {
      const [a, b] = scoreOf(m);
      return `<div class="mh"><span>${ic('cal', 'sm')} ${new Date(m.date + 'T12:00').toLocaleDateString('it-IT', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' })}</span><span>${ic('clock', 'sm')} ${esc(m.time)}</span><span>${ic('pin', 'sm')} ${esc(m.place || '—')}</span></div>

    }
    function reportBlock(m) {
      const r = m.report; if (!r) return '';
      const mem = lm().members, nm = id => { const x = mem.find(y => y.id === id); return x ? dispName(x) : null; }, rat = r.ratings || {};
      const voted = [...m.A, ...m.B].map(p => ({ id: p.id, v: rat[p.id] && typeof rat[p.id].v === 'number' ? rat[p.id].v : null })).filter(x => x.v != null);
      let mvp = '';
      if (voted.length) {
        const best = Math.max(...voted.map(x => x.v)), names = voted.filter(x => x.v === best).map(x => nm(x.id)).filter(Boolean);
        if (names.length) mvp = `<div class="mvp">🏅 <span>MVP: <b>${names.map(esc).join(', ')}</b> (${fmtV(best)})</span></div>`;
      }

   <div class="row"><div><label>Giorno</label><input type="date" value="${esc(d.date)}" oninput="S.draft.date=this.value"></div><div><label>Ora</label><input type="time" value="${esc(d.time)}" oninput="S.draft.time=this.value"></div></div>
   <label>Luogo</label><input value="${esc(d.place)}" placeholder="Campo / centro sportivo" oninput="S.draft.place=this.value">
   <div class="box scorebox"><div class="scorebar"><div><div class="tl">Squadra A</div><span class="mut">${cnt('A')} giocatori</span></div><b><span style="color:var(--blue)">${sc('A')}</span> <i class="mut">–</i> <span style="color:var(--orange)">${sc('B')}</span></b><div><div class="tl b">Squadra B</div><span class="mut">${cnt('B')} giocatori</span></div></div><div class="mut" style="text-align:center;margin-top:6px">Il risultato è la somma dei gol inseriti</div></div>
   <label>Formazioni e statistiche</label>
   ${mem.map(m => {
        const r = d.rows[m.id] || { t: '', g: 0, a: 0 };
        return `<div class="pick"><b style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name)}${m.uid ? '' : ' <span class="mut">(no account)</span>'}</b>
     <div class="tg"><button class="${r.t === 'A' ? 'on a' : ''}" onclick="setT(${q(m.id)},'A')">A</button><button class="${r.t === 'B' ? 'on b' : ''}" onclick="setT(${q(m.id)},'B')">B</button></div>
     ${r.t ? `<div class="st">⚽<button onclick="stp(${q(m.id)},'g',-1)">−</button><span>${r.g}</span><button onclick="stp(${q(m.id)},'g',1)">+</button></div>
     <div class="st">🎯<button onclick="stp(${q(m.id)},'a',-1)">−</button><span>${r.a}</span><button onclick="stp(${q(m.id)},'a',1)">+</button></div>` : '<span></span><span></span>'}</div>`
      }).join('')}
   <br><button class="btn sec" onclick="quickGuest()">+ Nuovo giocatore senza account</button>
   <button class="btn" onclick="saveMatch()">Salva partita</button>`;
    }
    window.S = S;
    window.setT = (id, t) => { const r = S.draft.rows[id]; if (r && r.t === t) delete S.draft.rows[id]; else S.draft.rows[id] = { t, g: r ? r.g : 0, a: r ? r.a : 0 }; keepScroll(); };
    window.stp = (id, k, v) => { const r = S.draft.rows[id]; r[k] = Math.max(0, r[k] + v); keepScroll(); };
    window.quickGuest = async () => {
      const name = (prompt('Nome del giocatore (senza account):') || '').trim(); if (!name) return;
      const m = newGuest(name); await DB.setMember(S.league.id, m); lm().members.push(m); keepScroll();
    };
    function keepScroll() { const m = document.querySelector('.modal>div'), y = m ? m.scrollTop : 0; render(); const n = document.querySelector('.modal>div'); if (n) n.scrollTop = y; }
    window.saveMatch = async () => {
      const d = S.draft, A = [], B = [];
      for (const [id, r] of Object.entries(d.rows)) (r.t === 'A' ? A : B).push({ id, g: r.g, a: r.a });
      if (!d.date || !d.time) return toast('Inserisci giorno e ora');
      if (!A.length || !B.length) return toast('Servono giocatori in entrambe le squadre');
      const prev = lm().matches.find(x => x.id === d.id), ids = new Set([...A, ...B].map(p => p.id));
      const obj = { id: d.id, date: d.date, time: d.time, place: d.place.trim(), A, B, ts: Date.now() };
      if (prev && prev.report) obj.report = { ...prev.report, ratings: Object.fromEntries(Object.entries(prev.report.ratings || {}).filter(([id]) => ids.has(id))) };
      await DB.saveMatch(S.league.id, obj);
      if (d.fx) { try { await DB.delFixture(S.league.id, d.fx); } catch (e) { console.error(e); } }
      const lid = S.league.id; S.modal = null; S.draft = null; await refresh(lid);
      if (!prev) { toast('Partita salvata ✅ Ora scrivi il resoconto'); openReport(d.id); }
      else { toast('Partita salvata, statistiche aggiornate ✅'); render(); }
    };

    /* ---------- Bacheca: resoconto ufficiale con voti e commenti (solo admin) ---------- */
    window.openReport = mid => {
      const m = lm().matches.find(x => x.id === mid), r = m.report, ratings = {};
      for (const p of [...m.A, ...m.B]) { const x = r && r.ratings && r.ratings[p.id]; ratings[p.id] = { v: x && typeof x.v === 'number' ? x.v : null, c: x ? x.c || '' : '' }; }
      S.draft = { mid, text: r ? r.text || '' : '', ratings }; S.modal = { type: 'report', mid }; render();
    };
    function reportForm() {
      const m = lm().matches.find(x => x.id === S.modal.mid), d = S.draft, mem = lm().members, [a, b] = scoreOf(m);
      const row = p => {
        const x = mem.find(y => y.id === p.id); if (!x) return ''; const r = d.ratings[p.id];
        return `<div class="rp"><div class="top"><b>${esc(x.name)}</b><div class="stv"><button onclick="rv(${q(p.id)},-1)">−</button><span>${r.v == null ? '–' : fmtV(r.v)}</span><button onclick="rv(${q(p.id)},1)">+</button></div></div>
      <input placeholder="Commento su ${esc(dispName(x))}…" value="${esc(r.c)}" oninput="S.draft.ratings[${q(p.id)}].c=this.value"></div>`;
      };
      return `<h2>${m.report ? 'Modifica resoconto' : 'Resoconto della partita'}</h2>
   <p class="mut">${new Date(m.date + 'T12:00').toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' })} · ${a} - ${b}</p>
   <label>Com'è andata</label><textarea placeholder="Racconta la partita…" oninput="S.draft.text=this.value">${esc(d.text)}</textarea>
   <label>Voti e commenti · Squadra A</label>${m.A.map(row).join('')}
   <label style="display:block;margin-top:14px">Voti e commenti · Squadra B</label>${m.B.map(row).join('')}
   <p class="mut">Voti da 1 a 10 (passo 0,5): entrano nella media voto di ogni giocatore. Un giocatore può restare senza voto.</p>
   <button class="btn" onclick="saveReport()">📣 Pubblica in bacheca</button>`;
    }
    window.rv = (id, dir) => { const r = S.draft.ratings[id]; r.v = r.v == null ? 6 : (dir > 0 ? Math.min(10, r.v + 0.5) : (r.v <= 1 ? null : r.v - 0.5)); keepScroll(); };
    window.saveReport = async () => {
      const lid = S.league.id, m = lm().matches.find(x => x.id === S.modal.mid), d = S.draft, ratings = {};
      for (const [id, r] of Object.entries(d.ratings)) { const c = (r.c || '').trim(); if (r.v != null || c) ratings[id] = { v: r.v == null ? null : r.v, c }; }
      const text = (d.text || '').trim();
      if (!text && !Object.keys(ratings).length) return toast('Scrivi il resoconto o dai almeno un voto');
      const old = m.report || {}, report = { text, ratings, ts: old.ts || Date.now(), by: old.by || S.user.uid, byName: old.byName || S.me.name };
      try { await DB.saveMatch(lid, { ...m, report }); } catch (e) { console.error(e); return toast('Pubblicazione non riuscita'); }
      S.modal = null; S.draft = null; await refresh(lid); S.ltab = 'board'; toast('Resoconto pubblicato 📣'); render();
    };
    window.delReport = async mid => {
      if (!confirm('Eliminare il resoconto (testo, voti e commenti)?')) return;
      const lid = S.league.id, m = lm().matches.find(x => x.id === mid), { report, ...rest } = m;
      await DB.saveMatch(lid, rest); await refresh(lid); toast('Resoconto eliminato'); render();
    };

    /* ---------- Calendario dei voti ---------- */
    function ratingEntries(refs) {
      const out = [];
      for (const { lid, mid } of refs) {
        const lg = S.leagues.find(l => l.id === lid);
        for (const m of S.cache[lid].matches) {
          const team = m.A.some(p => p.id === mid) ? 'A' : m.B.some(p => p.id === mid) ? 'B' : null; if (!team) continue;
          const [a, b] = scoreOf(m), my = team === 'A' ? a : b, op = team === 'A' ? b : a, x = m.report && m.report.ratings && m.report.ratings[mid];
          out.push({ date: m.date, time: m.time, v: x && typeof x.v === 'number' ? x.v : null, c: x ? x.c || '' : '', lg: lg ? lg.name : '', score: `${a}-${b}`, res: my > op ? 'Vittoria' : my === op ? 'Pareggio' : 'Sconfitta', team, place: m.place || '', mvp: mvpIds(m).includes(mid) });
        }
      }
      return out.sort((x, y) => (x.date + x.time).localeCompare(y.date + y.time));
    }
    window.openCal = who => {
      let refs, title;
      if (who === 'me') { refs = S.leagues.map(l => ({ lid: l.id, mid: (myMember(l.id) || {}).id })).filter(r => r.mid); title = 'I miei voti'; }
      else { refs = [{ lid: S.league.id, mid: who }]; title = 'Voti di ' + dispName(lm().members.find(x => x.id === who)); }
      const entries = ratingEntries(refs), last = entries.length ? entries[entries.length - 1].date : todayStr(), [y, mo] = last.split('-').map(Number);
      S.modal = { type: 'cal', entries, ym: { y, mo: mo - 1 }, sel: null, prev: S.modal, title }; render();
    };
    window.calBack = () => { S.modal = S.modal.prev; render(); };
    window.calSel = k => { S.modal.sel = S.modal.sel === k ? null : k; keepScroll(); };
    window.calNav = d => { let { y, mo } = S.modal.ym; mo += d; if (mo < 0) { mo = 11; y-- } if (mo > 11) { mo = 0; y++ } S.modal.ym = { y, mo }; S.modal.sel = null; keepScroll(); };
    function calView() {
      const m = S.modal, { y, mo } = m.ym, byDay = {};
      m.entries.forEach(e => (byDay[e.date] = byDay[e.date] || []).push(e));
      const avgOf = a => a.length ? a.reduce((p, q) => p + q, 0) / a.length : null;
      const vs = m.entries.filter(e => e.v != null).map(e => e.v), avg = avgOf(vs);
      const start = (new Date(y, mo, 1).getDay() + 6) % 7, days = new Date(y, mo + 1, 0).getDate();
      let cells = ['L', 'M', 'M', 'G', 'V', 'S', 'D'].map(x => `<div class="dw">${x}</div>`).join('');
      for (let i = 0; i < start; i++) cells += '<div class="cd empty"></div>';
      for (let d = 1; d <= days; d++) {
        const key = `${y}-${String(mo + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`, es = byDay[key];
        let inner = `<span class="dn">${d}</span>`;
        if (es) { const a = avgOf(es.filter(e => e.v != null).map(e => e.v)); inner += a == null ? '<span class="cv v-no">–</span>' : `<span class="cv v-${vClass(a)}">${fmtV(a)}</span>`; if (es.some(e => e.mvp)) inner += '<span class="mv">🏅</span>'; }
        cells += `<div class="cd${es ? ' has' : ''}${m.sel === key ? ' sel' : ''}"${es ? ` onclick="calSel(${q(key)})"` : ''}>${inner}</div>`;
      }
      const det = (byDay[m.sel] || []).map(e => `<div class="box"><b>${e.v == null ? 'Nessun voto' : 'Voto ' + fmtV(e.v)}</b>${e.mvp ? ' · 🏅 MVP' : ''} · ${e.res} ${e.score}<div class="mut">${esc(e.lg)}${e.place ? ' · ' + esc(e.place) : ''} · Squadra ${e.team}</div>${e.c ? `<div style="margin-top:6px">“${esc(e.c)}”</div>` : ''}</div>`).join('');
      return `<h2>${esc(m.title)}</h2>
   <div class="grid" style="grid-template-columns:repeat(4,1fr)"><div class="stat"><b>${avg == null ? '–' : f1(avg)}</b><span>Media</span></div><div class="stat"><b>${vs.length}</b><span>Voti</span></div><div class="stat"><b>${vs.length ? fmtV(Math.max(...vs)) : '–'}</b><span>Migliore</span></div><div class="stat"><b>🏅 ${m.entries.filter(e => e.mvp).length}</b><span>MVP</span></div></div>
   <div class="calh"><button onclick="calNav(-1)">‹</button><b>${new Date(y, mo, 1).toLocaleDateString('it-IT', { month: 'long', year: 'numeric' })}</b><button onclick="calNav(1)">›</button></div>
   <div class="cal">${cells}</div>
   <p class="mut">${m.entries.length ? 'Sotto il giorno di ogni calcetto c\'è il voto preso. Tocca un giorno per leggere il commento.' : 'Nessun calcetto giocato finora.'}</p>${det}`;
    }

    /* ---------- Partite programmate (sezione "Partite") ---------- */
    const fxTime = f => new Date(f.date + 'T' + (f.time || '00:00')).getTime();
    const isUpcoming = f => fxTime(f) >= Date.now() - 3 * 3600 * 1000;      /* resta "in programma" fino a 3 ore dopo il calcio d'inizio */
    function relDay(f) {
      const a = new Date(f.date + 'T12:00'), t = new Date(); t.setHours(12, 0, 0, 0); const n = Math.round((a - t) / 864e5);
      return n === 0 ? 'Oggi' : n === 1 ? 'Domani' : n > 1 ? `Tra ${n} giorni` : n === -1 ? 'Ieri' : `${-n} giorni fa`;
    }
    function allFixtures() {
      const out = [];
      for (const l of S.leagues) for (const f of (S.cache[l.id].fixtures || [])) out.push({ ...f, lid: l.id, lname: l.name, admin: isAdmin(l) });
      return out.sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
    }
    function fxCard(f) {
      const dt = new Date(f.date + 'T12:00'), d = dt.toLocaleDateString('it-IT', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      return `<div class="box"><div class="row sp"><button class="badge" style="margin:0;flex:0;border:0;cursor:pointer" onclick="enter(${q(f.lid)})">🏆 ${esc(f.lname)}</button><span class="mut" style="text-align:right;font-weight:600">${relDay(f)}</span></div>
   <div class="next" style="background:none;border:0;padding:0;margin-top:12px"><div class="day"><b>${dt.getDate()}</b><span>${dt.toLocaleDateString('it-IT', { month: 'short' })}</span></div>
   <div style="min-width:0"><div class="fxd" style="margin:0 0 2px">${d}</div><div class="mut">${ic('clock', 'sm')} ${esc(f.time)}${f.place ? ` · ${ic('pin', 'sm')} ${esc(f.place)}` : ''}</div></div></div>
   ${f.note ? `<p class="fxn">${esc(f.note)}</p>` : ''}
   ${f.admin ? `<div class="actions"><button class="btn sm" onclick="playFixture(${q(f.lid)},${q(f.id)})">${ic('users', 'sm')}Inserisci formazioni</button><button class="btn sec sm" style="flex:0" onclick="editFixture(${q(f.lid)},${q(f.id)})" aria-label="Modifica">${ic('edit', 'sm')}</button><button class="btn danger sm" style="flex:0" onclick="delFixture(${q(f.lid)},${q(f.id)})" aria-label="Elimina">${ic('trash', 'sm')}</button></div>` : ''}</div>`;
    }
    function viewFixtures() {
      const all = allFixtures(), up = all.filter(isUpcoming), past = all.filter(f => !isUpcoming(f) && f.admin).reverse(), canCreate = S.leagues.some(isAdmin);
      return `<h1>Partite</h1><p class="mut" style="margin-top:-8px">Le partite in programma nelle tue leghe, con la lega che le organizza.</p>
   ${canCreate ? `<div class="actions" style="margin:0 0 18px"><button class="btn" style="flex:0 1 auto" onclick="newFixture()">${ic('plus')}Programma una partita</button></div>` : ''}
   ${up.length ? `<div class="fxgrid">${up.map(fxCard).join('')}</div>` : empty('📅', 'Nessuna partita in programma.' + (canCreate ? '' : ' Quando un admin ne programma una la vedrai qui.'))}
   ${past.length ? `<h2>Passate da chiudere</h2><p class="mut">Programmate e già trascorse: inserisci le formazioni oppure eliminale. Le vedono solo gli admin.</p><div class="fxgrid">${past.map(fxCard).join('')}</div>` : ''}`;
    }
    window.newFixture = () => {
      const mine = S.leagues.filter(isAdmin); if (!mine.length) return;
      const t = new Date(); t.setDate(t.getDate() + 1);
      S.draft = { id: uid() + uid(), lid: mine[0].id, date: `${t.getFullYear()}-${String(t.getMonth() + 1).padStart(2, '0')}-${String(t.getDate()).padStart(2, '0')}`, time: '21:00', place: '', note: '' };
      S.modal = { type: 'fixture', edit: false }; render();
    };
    window.editFixture = (lid, id) => {
      const f = S.cache[lid].fixtures.find(x => x.id === id);
      S.draft = { id, lid, date: f.date, time: f.time, place: f.place || '', note: f.note || '' }; S.modal = { type: 'fixture', edit: true }; render();
    };
    function fixtureForm() {
      const d = S.draft, mine = S.leagues.filter(isAdmin);
      return `<h2>${S.modal.edit ? 'Modifica partita programmata' : 'Programma una partita'}</h2>
   <label>Lega che organizza</label><select ${S.modal.edit ? 'disabled' : ''} onchange="S.draft.lid=this.value">${mine.map(l => `<option value="${esc(l.id)}" ${l.id === d.lid ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select>
   <div class="row"><div><label>Giorno</label><input type="date" value="${esc(d.date)}" oninput="S.draft.date=this.value"></div><div><label>Ora</label><input type="time" value="${esc(d.time)}" oninput="S.draft.time=this.value"></div></div>
   <label>Luogo</label><input value="${esc(d.place)}" placeholder="Campo / centro sportivo" oninput="S.draft.place=this.value">
   <label>Note (facoltative)</label><input value="${esc(d.note)}" maxlength="140" placeholder="Es. portate le maglie chiare" oninput="S.draft.note=this.value">
   <button class="btn" onclick="saveFixture()">Salva</button>`;
    }
    window.saveFixture = async () => {
      const d = S.draft; if (!d.date || !d.time) return toast('Inserisci giorno e ora');
      const f = { id: d.id, date: d.date, time: d.time, place: d.place.trim(), note: d.note.trim(), ts: Date.now(), by: S.user.uid };
      try { await DB.saveFixture(d.lid, f); } catch (e) { console.error(e); return toast('Salvataggio non riuscito: hai aggiornato le regole Firebase?'); }
      S.modal = null; S.draft = null; await loadHome(); toast('Partita programmata 📅'); render();
    };
    window.delFixture = async (lid, id) => {
      if (!confirm('Eliminare la partita programmata?')) return;
      try { await DB.delFixture(lid, id); } catch (e) { console.error(e); return toast('Eliminazione non riuscita'); }
      await loadHome(); render();
    };
    window.playFixture = (lid, id) => {   /* apre il modulo partita già compilato con data, ora e luogo; salvando, la partita programmata sparisce */
      const f = S.cache[lid].fixtures.find(x => x.id === id);
      S.league = S.leagues.find(l => l.id === lid); S.ltab = 'matches'; newMatch({ date: f.date, time: f.time, place: f.place || '', fx: id });
    };

    /* ---------- Privacy: esportazione dei propri dati (portabilità) ---------- */
    window.exportData = () => {
      const out = {
        esportato: new Date().toISOString(), account: { uid: S.user.uid, nome: S.me.name, email: S.me.email || S.user.email || null },
        carta: S.me.card, accettazionePrivacy: S.me.privacy || null, leghe: []
      };
      for (const l of S.leagues) {
        const m = myMember(l.id); if (!m) continue; const st = leagueStats(l.id)[m.id];
        out.leghe.push({
          lega: l.name, admin: l.admins.includes(S.user.uid), giocatore: { nome: m.name, carta: m.card, correzioniAdmin: { statistiche: m.adj || {}, overall: m.ovrAdj || 0 } },
          statistiche: { partite: st.played, vittorie: st.wins, pareggi: st.draws, sconfitte: st.losses, gol: st.goals, assist: st.assists, mvp: st.mvp, mediaVoto: st.avg, overall: st.ovr },
          partite: ratingEntries([{ lid: l.id, mid: m.id }]).map(e => ({ data: e.date, ora: e.time, luogo: e.place, squadra: e.team, risultato: e.score, esito: e.res, voto: e.v, commento: e.c, mvp: e.mvp }))
        });
      }
      const url = URL.createObjectURL(new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = 'calcetto-club-miei-dati.json'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500); toast('Dati scaricati ✅');
    };

    /* service worker: app installabile e apribile anche senza rete */
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
      addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e)));

    boot();
  </script>
</body>

</html>
