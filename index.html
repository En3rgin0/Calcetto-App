.vb-hi{background:#3ddc84}.vb-mid{background:#f5c542;color:#2a1d00}.vb-lo{background:#ff7b7b;color:#2b0505}.vb-no{background:var(--bg2);color:var(--mut)}
.rp{padding:8px 0;border-bottom:1px solid var(--line)}
.rp .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.rp input{margin:6px 0 0}
.stv{display:flex;align-items:center;gap:6px}.stv button{background:var(--card);border:1px solid var(--line);width:34px;height:34px;border-radius:9px;font-weight:800;font-size:17px}
.stv span{min-width:36px;text-align:center;font-weight:800;font-size:17px}
.calh{display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px}

.cal .dw{text-align:center;font-size:11px;color:var(--mut);padding:2px 0}
.cd{min-height:56px;border-radius:9px;background:var(--bg2);padding:4px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:3px}
.cd.empty{background:none}.cd .dn{font-size:12px;color:var(--mut)}
.cd.has{background:var(--card);border:1px solid var(--line);cursor:pointer}.cd.has .dn{color:var(--tx);font-weight:700}.cd.sel{outline:2px solid var(--acc)}
.cv{font-weight:900;font-size:15px}.cd .mv{font-size:11px;line-height:1}.v-hi{color:#3ddc84}.v-mid{color:#f5c542}.v-lo{color:#ff7b7b}.v-no{color:var(--mut)}
</style>

<body>
<div id="app"></div>
<script type="module">
/* ============================================================
   CONFIGURAZIONE FIREBASE (null = modalità demo locale)
   ============================================================ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyCtWrH1rPpPWrl6gJIS_uovYI2zbMob0WU",
  authDomain: "calcetti-d4581.firebaseapp.com",
  projectId: "calcetti-d4581",
  storageBucket: "calcetti-d4581.firebasestorage.app",
  messagingSenderId: "128704237585",
  appId: "1:128704237585:web:332e37de8602fbfd7a61b0"
};

/* ---------------- Statistiche e overall ---------------- */
const OV_MIN = 64, OV_MAX = 99;
const clampOv = x => Math.max(OV_MIN, Math.min(OV_MAX, x));
function calcOverall(s){
  const n = s.played; if(!n) return OV_MIN;
  const perf = 0.35*((s.wins + 0.5*s.draws)/n)
             + 0.35*Math.min(s.goals/n/2, 1)
             + 0.30*Math.min(s.assists/n/1.2, 1);
  const f = 0.8*perf*Math.min(1, n/10) + 0.2*Math.min(n/40, 1);
  return clampOv(Math.round(OV_MIN + (OV_MAX-OV_MIN)*f));
}
const ADJ = ['wins','draws','losses','goals','assists'];
const emptyStats = () => ({played:0,wins:0,draws:0,losses:0,goals:0,assists:0});
function computeStats(matches){
  const out = {}; const get = id => out[id] || (out[id] = emptyStats());
  for(const m of matches){
    const sa = m.A.reduce((t,p)=>t+(+p.g||0),0), sb = m.B.reduce((t,p)=>t+(+p.g||0),0);
    for(const [team,my,op] of [[m.A,sa,sb],[m.B,sb,sa]]){
      for(const p of team){
        const s = get(p.id); s.played++; s.goals += +p.g||0; s.assists += +p.a||0;
        if(my>op) s.wins++; else if(my===op) s.draws++; else s.losses++;
      }
    }
  }
  return out;
}
const finalize = s => ({...s, winPct: s.played? Math.round(100*s.wins/s.played):0,
  gpm: s.played? s.goals/s.played:0, apm: s.played? s.assists/s.played:0, ovr: calcOverall(s)});
const f1 = x => (Math.round(x*10)/10).toFixed(1);

/* Statistiche finali di ogni giocatore della lega =
   calcolo dalle partite + correzioni manuali dell'admin (adj, ovrAdj) */
function mvpIds(m){
  const r = m.report && m.report.ratings; if(!r) return [];
  const v = [...m.A,...m.B].map(p=>({id:p.id,v:r[p.id]&&typeof r[p.id].v==='number'?r[p.id].v:null})).filter(x=>x.v!=null);
  if(!v.length) return [];
  const best = Math.max(...v.map(x=>x.v)); return v.filter(x=>x.v===best).map(x=>x.id);
}
function leagueStats(lid){
  const {members,matches} = S.cache[lid], base = computeStats(matches), out = {}, rs = {}, mv = {};
  for(const mt of matches){ for(const id of mvpIds(mt)) mv[id] = (mv[id]||0)+1;
    const r = mt.report && mt.report.ratings; if(!r) continue;
    for(const [pid,x] of Object.entries(r)) if(x && typeof x.v==='number'){ const q = rs[pid]||(rs[pid]={sum:0,n:0}); q.sum+=x.v; q.n++; } }
  for(const m of members){
    const b = base[m.id] || emptyStats(), a = m.adj || {}, s = emptyStats();
    for(const k of ADJ) s[k] = Math.max(0, (b[k]||0) + (+a[k]||0));
    s.played = s.wins + s.draws + s.losses;
    const f = finalize(s); f.autoOvr = f.ovr; f.ovr = clampOv(f.ovr + (+m.ovrAdj||0)); f.base = b; const q = rs[m.id]||{sum:0,n:0}; f.rsum = q.sum; f.rn = q.n; f.avg = q.n ? q.sum/q.n : null; f.mvp = mv[m.id]||0;
    out[m.id] = f;
  }
  return out;
}

/* ---------------- Utility ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2,10);
const mkCode = () => Array.from({length:6},()=> 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');
const toast = t => { const e=document.createElement('div'); e.className='toast'; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(),2600); };
const THEMES = {
  gold:{bg:'linear-gradient(145deg,#f9e27d,#d9a21b 60%,#b57b0a)',fg:'#3b2a00'},
  silver:{bg:'linear-gradient(145deg,#f4f6f8,#aeb7c2 60%,#8893a0)',fg:'#1e252d'},
  bronze:{bg:'linear-gradient(145deg,#e9b37a,#b4672c 60%,#8a4513)',fg:'#2d1503'},
  black:{bg:'linear-gradient(145deg,#3a3a44,#15151b 60%,#050507)',fg:'#f5d76e'},
  blue:{bg:'linear-gradient(145deg,#7cc4ff,#2a6fdb 60%,#14378f)',fg:'#fff'},
  green:{bg:'linear-gradient(145deg,#8cf2a8,#1fa35a 60%,#0b5b30)',fg:'#04210f'},
  purple:{bg:'linear-gradient(145deg,#d0a2ff,#7a3ee0 60%,#3f1b86)',fg:'#fff'},
  red:{bg:'linear-gradient(145deg,#ff9a8a,#d9322a 60%,#7f0f0a)',fg:'#fff'},
};
const EMOJIS = ['⚽','🧤','🦁','🐺','🦅','🔥','⚡','👑','🐐','🚀','🦈','🐯'];
const POS = ['POR','DIF','CEN','ATT'];
const defCard = name => ({nick:(name||'').split(' ')[0].slice(0,12), pos:'ATT', num:10, emoji:'⚽', photo:'', theme:'gold'});
/* Un giocatore di lega: uid = account collegato (null = senza account) */
const norm = m => ({...m, uid: m.uid!==undefined ? m.uid : (m.guest?null:m.id), adj:m.adj||{}, ovrAdj:+m.ovrAdj||0, card:m.card||defCard(m.name)});
const newGuest = name => ({id:'g_'+uid()+uid(), uid:null, name, guest:true, card:defCard(name), adj:{}, ovrAdj:0});

/* ---------------- Storage: Locale (demo) e Firebase ---------------- */
const Local = {
  load(){ try{return JSON.parse(localStorage.getItem('cc_db'))||{users:{},leagues:{},members:{},matches:{}}}catch{return {users:{},leagues:{},members:{},matches:{}}} },
  save(d){ localStorage.setItem('cc_db',JSON.stringify(d)); },
  async getUser(id){ return this.load().users[id]||null },
  async setUser(id,u){ const d=this.load(); d.users[id]={...d.users[id],...u}; this.save(d); },
  async leaguesOf(id){ return Object.values(this.load().leagues).filter(l=>l.memberIds.includes(id)) },
  async saveLeague(l){ const d=this.load(); d.leagues[l.id]=l; this.save(d); },
  async findByCode(c){ return Object.values(this.load().leagues).find(l=>l.code===c)||null },
  async members(l){ return Object.values(this.load().members[l]||{}) },
  async setMember(l,m){ const d=this.load(); (d.members[l]=d.members[l]||{})[m.id]=m; this.save(d); },
  async patchMember(l,id,f){ const d=this.load(); const m=(d.members[l]=d.members[l]||{})[id]||{id}; d.members[l][id]=Object.assign(m,f); this.save(d); },
  async delMember(l,id){ const d=this.load(); delete (d.members[l]||{})[id]; this.save(d); },
  async matches(l){ return Object.values(this.load().matches[l]||{}) },
  async saveMatch(l,m){ const d=this.load(); (d.matches[l]=d.matches[l]||{})[m.id]=m; this.save(d); },
  async delMatch(l,id){ const d=this.load(); delete (d.matches[l]||{})[id]; this.save(d); },
};
let DB = Local, fb = null;
async function initFirebase(){
  const V='10.12.2', base=`https://www.gstatic.com/firebasejs/${V}/`;
  const [app,auth,fs] = await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-firestore.js')]);
  const a = app.initializeApp(FIREBASE_CONFIG), au = auth.getAuth(a), db = fs.getFirestore(a);
  fb = {auth,au,fs};
  const {doc,getDoc,setDoc,getDocs,collection,query,where,deleteDoc} = fs;
  DB = {
    async getUser(id){ const s=await getDoc(doc(db,'users',id)); return s.exists()?s.data():null },
    async setUser(id,u){ await setDoc(doc(db,'users',id),u,{merge:true}) },
    async leaguesOf(id){ const s=await getDocs(query(collection(db,'leagues'),where('memberIds','array-contains',id))); return s.docs.map(d=>d.data()) },
    async saveLeague(l){ await setDoc(doc(db,'leagues',l.id),l) },
    async findByCode(c){ const s=await getDocs(query(collection(db,'leagues'),where('code','==',c))); return s.docs[0]?.data()||null },
    async members(l){ const s=await getDocs(collection(db,'leagues',l,'members')); return s.docs.map(d=>d.data()) },
    async setMember(l,m){ await setDoc(doc(db,'leagues',l,'members',m.id),m) },
    async patchMember(l,id,f){ await setDoc(doc(db,'leagues',l,'members',id),f,{merge:true}) },
    async delMember(l,id){ await deleteDoc(doc(db,'leagues',l,'members',id)) },
    async matches(l){ const s=await getDocs(collection(db,'leagues',l,'matches')); return s.docs.map(d=>d.data()) },
    async saveMatch(l,m){ await setDoc(doc(db,'leagues',l,'matches',m.id),m) },
    async delMatch(l,id){ await deleteDoc(doc(db,'leagues',l,'matches',id)) },
  };
}

/* ---------------- Stato ---------------- */
const S = {user:null,me:null,tab:'me',leagues:[],cache:{},league:null,ltab:'rank',modal:null,draft:null,agg:null,ready:false};
const lm = () => S.cache[S.league.id];
const isAdmin = l => l.admins.includes(S.user.uid);
const myMember = lid => (S.cache[lid]?.members||[]).find(m=>m.uid===S.user.uid);
const dispName = m => (m.card&&m.card.nick)||m.name;

/* ---------------- Auth ---------------- */
async function boot(){
  if(FIREBASE_CONFIG){
    await initFirebase();
    fb.auth.onAuthStateChanged(fb.au, async u => {
      if(u) await afterLogin({uid:u.uid,name:u.displayName||'Giocatore',email:u.email,photo:u.photoURL});
      else { S.user=null; S.ready=true; render(); }
    });
  } else {
    const s = localStorage.getItem('cc_session');
    if(s) await afterLogin(JSON.parse(s)); else { S.ready=true; render(); }
  }
}
window.login = async () => {
  if(FIREBASE_CONFIG){
    try{ await fb.auth.signInWithPopup(fb.au,new fb.auth.GoogleAuthProvider()); }
    catch(e){ if(String(e.code).includes('popup')) await fb.auth.signInWithRedirect(fb.au,new fb.auth.GoogleAuthProvider()); else toast('Login non riuscito'); }
  } else {
    const name = prompt('Modalità demo: come ti chiami?'); if(!name) return;
    const u = {uid:'u_'+name.toLowerCase().replace(/\W+/g,'')+uid().slice(0,3),name,email:name+'@demo.local'};
    localStorage.setItem('cc_session',JSON.stringify(u)); await afterLogin(u);
  }
};
window.logout = async () => {
  if(FIREBASE_CONFIG) await fb.auth.signOut(fb.au); else localStorage.removeItem('cc_session');
  Object.assign(S,{user:null,me:null,leagues:[],cache:{},league:null,tab:'me',modal:null}); render();
};
async function afterLogin(u){
  S.user = u;
  let me = await DB.getUser(u.uid);
  if(!me){ me = {uid:u.uid,name:u.name,email:u.email,card:defCard(u.name)}; await DB.setUser(u.uid,me); }
  S.me = me; await loadHome(); S.ready = true; render();
}
async function loadHome(){
  S.leagues = await DB.leaguesOf(S.user.uid);
  for(const l of S.leagues) await loadLeague(l.id);
  const tot = emptyStats(), adjs = []; let rs = 0, rn = 0, mvp = 0;
  for(const l of S.leagues){
    const m = myMember(l.id); if(!m) continue;
    const st = leagueStats(l.id)[m.id];
    for(const k of ['played',...ADJ]) tot[k]+=st[k];
    adjs.push(m.ovrAdj||0); rs += st.rsum; rn += st.rn; mvp += st.mvp;
  }
  S.agg = finalize(tot); S.agg.rn = rn; S.agg.avg = rn ? rs/rn : null; S.agg.mvp = mvp;
  if(adjs.length) S.agg.ovr = clampOv(S.agg.ovr + Math.round(adjs.reduce((a,b)=>a+b,0)/adjs.length));
  /* se sono dentro una lega ma non ho ancora un giocatore → chiedi se collegarne uno esistente */
  if(!S.modal){ const p = S.leagues.find(l=>!myMember(l.id)); if(p) S.modal = {type:'claimAsk',lid:p.id}; }
}
async function loadLeague(id){
  const [members,matches] = await Promise.all([DB.members(id),DB.matches(id)]);
  matches.sort((a,b)=>(b.date+b.time).localeCompare(a.date+a.time));
  S.cache[id] = {members:members.map(norm),matches};
}

function ranking(){
  const {members} = lm(), st = leagueStats(S.league.id);
  return members.map(m=>({m,s:st[m.id]})).sort((a,b)=>b.s.ovr-a.s.ovr||b.s.goals-a.s.goals||a.m.name.localeCompare(b.m.name));
}
function avatar(m){ const c=m.card||{}; return `<div class="av">${c.photo?`<img src="${c.photo}">`:(c.emoji||'⚽')}</div>`; }
const scoreOf = m => [m.A.reduce((t,p)=>t+(+p.g||0),0), m.B.reduce((t,p)=>t+(+p.g||0),0)];
const vClass = v => v>=7?'hi':v>=6?'mid':'lo';
const fmtV = v => String(+(+v).toFixed(1));
function matchHead(m){ const [a,b]=scoreOf(m);
  return `<div class="mh">📅 ${new Date(m.date+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short',year:'numeric'})} · 🕐 ${esc(m.time)} · 📍 ${esc(m.place||'—')}</div><div class="score">${a} - ${b}</div>`; }
function reportBlock(m){
  const r = m.report; if(!r) return '';
  const mem = lm().members, nm = id => { const x=mem.find(y=>y.id===id); return x?dispName(x):null; }, rat = r.ratings||{};
  const voted = [...m.A,...m.B].map(p=>({id:p.id,v:rat[p.id]&&typeof rat[p.id].v==='number'?rat[p.id].v:null})).filter(x=>x.v!=null);
  let mvp = '';
  if(voted.length){ const best = Math.max(...voted.map(x=>x.v)), names = voted.filter(x=>x.v===best).map(x=>nm(x.id)).filter(Boolean);
    if(names.length) mvp = `<div class="mvp">⭐ MVP: <b>${names.map(esc).join(', ')}</b> (${fmtV(best)})</div>`; }
  const lines = t => t.map(p=>{ const x=rat[p.id]; if(!x||(x.v==null&&!x.c)) return ''; const n=nm(p.id); if(!n) return '';
    return `<div class="vl"><span class="vote vb-${x.v==null?'no':vClass(x.v)}">${x.v==null?'–':fmtV(x.v)}</span><b>${esc(n)}</b><span class="cm">${esc(x.c||'')}</span></div>`; }).join('');
  const la = lines(m.A), lb = lines(m.B);
  return `<div class="rep"><div class="tl">📋 Resoconto ufficiale</div>${r.text?`<p>${esc(r.text)}</p>`:''}${mvp}
    ${la?`<div class="mut" style="margin-top:6px">Squadra A</div>${la}`:''}${lb?`<div class="mut" style="margin-top:6px">Squadra B</div>${lb}`:''}
    <div class="mut" style="margin-top:8px">Pubblicato${r.byName?' da '+esc(r.byName):''}</div></div>`;
}
function viewLeague(){
  const l = S.league, admin = isAdmin(l);
  let h = `<div class="row sp" style="margin-bottom:6px"><button class="btn sec sm" style="flex:0" onclick="closeLeague()">‹ Indietro</button>

    <h1>${esc(l.name)}${admin?'<span class="badge">ADMIN</span>':''}</h1>
    <div class="seg"><button class="${S.ltab==='board'?'on':''}" onclick="ltab('board')">Bacheca</button><button class="${S.ltab==='rank'?'on':''}" onclick="ltab('rank')">Classifica</button><button class="${S.ltab==='matches'?'on':''}" onclick="ltab('matches')">Partite</button><button class="${S.ltab==='players'?'on':''}" onclick="ltab('players')">Giocatori</button></div>`;
  if(S.ltab==='board'){
    const ms = lm().matches, withR = ms.filter(m=>m.report), without = ms.filter(m=>!m.report);
    h += withR.map(m=>`<div class="box match">${matchHead(m)}${reportBlock(m)}${admin?`<div class="row" style="margin-top:10px"><button class="btn sec sm" onclick="openReport('${m.id}')">✏️ Modifica resoconto</button><button class="btn danger sm" onclick="delReport('${m.id}')">🗑 Elimina</button></div>`:''}</div>`).join('');
    if(!withR.length) h += "<p class='mut'>La bacheca è vuota: dopo ogni calcetto l'admin pubblica qui il resoconto ufficiale con voti e commenti.</p>";
    if(admin && without.length) h += '<h2>Resoconti da scrivere</h2>' + without.map(m=>{ const [a,b]=scoreOf(m);
      return `<div class="pl"><div class="nm"><b>${new Date(m.date+'T12:00').toLocaleDateString('it-IT',{day:'numeric',month:'short',year:'numeric'})} · ${a}-${b}</b><span class="mut">${esc(m.place||'—')}</span></div><button class="btn sm" onclick="openReport('${m.id}')">Scrivi</button></div>`; }).join('');
  } else if(S.ltab==='rank'){
    h += ranking().map(({m,s},i)=>`<div class="pl" onclick="showPlayer('${m.id}')"><div class="rk">${i+1}</div>${avatar(m)}<div class="nm"><b>${esc(dispName(m))}</b><span class="mut">${s.played}P · ${s.winPct}% V · ${s.goals}G · ${s.assists}A${s.avg==null?'':' · ⭐'+f1(s.avg)}${s.mvp?' · 🏅'+s.mvp:''}</span></div><div class="ov">${s.ovr}</div></div>`).join('') || '<p class="mut">Nessun giocatore.</p>';
  } else if(S.ltab==='matches'){
    const {matches,members} = lm(); const nm = id => { const m=members.find(x=>x.id===id); return m?dispName(m):'?'; };
    const tl = t => t.map(p=>`<div>${esc(nm(p.id))}${p.g?` ⚽${p.g}`:''}${p.a?` 🎯${p.a}`:''}</div>`).join('');
    h += matches.map(m=>`<div class="box match">${matchHead(m)}<div class="teams"><div><div class="tl">Squadra A</div>${tl(m.A)}</div><div><div class="tl" style="color:#f97316">Squadra B</div>${tl(m.B)}</div></div>
      ${reportBlock(m)}
      ${admin?`<div class="row" style="margin-top:10px"><button class="btn sec sm" onclick="editMatch('${m.id}')">✏️ Partita</button><button class="btn sec sm" onclick="openReport('${m.id}')">📋 Resoconto</button><button class="btn danger sm" onclick="delMatch('${m.id}')">🗑</button></div>`:''}</div>`).join('') || '<p class="mut">Nessuna partita registrata'+(admin?': premi “+ Partita”.':'.')+'</p>';
  } else {
    const st = leagueStats(l.id);
    h += lm().members.map(m=>`<div class="pl" onclick="showPlayer('${m.id}')">${avatar(m)}<div class="nm"><b>${esc(m.name)}${m.uid&&l.admins.includes(m.uid)?'<span class="badge">ADMIN</span>':''}</b><span class="mut">${m.uid?'Registrato con Google':'Senza account'}</span></div><div class="ov">${st[m.id].ovr}</div></div>`).join('');
    if(admin) h += `<br><button class="btn sec" onclick="openModal('guest')">+ Aggiungi giocatore senza account</button>`;
  }
  return h;
}

/* ---------- Collegamento giocatore ↔ account ---------- */
window.claim = async (lid,mid) => {
  await loadLeague(lid);
  const m = S.cache[lid].members.find(x=>x.id===mid);
  if(!m || m.uid) { toast('Questo giocatore è già stato collegato'); S.modal={type:'claimPick',lid}; return render(); }
  if(!confirm(`Collegare “${m.name}” al tuo account? Statistiche e overall diventeranno tuoi.`)) return;
  try{ await DB.patchMember(lid,mid,{uid:S.user.uid,guest:false,name:S.me.name,card:S.me.card}); }
  catch(e){ console.error(e); toast('Impossibile collegare: riprova'); return; }
  S.modal=null; await loadHome(); toast('Giocatore collegato al tuo account ✅'); S.tab='lg'; render();
};
window.createSelf = async lid => {
  try{ await DB.setMember(lid,{id:S.user.uid,uid:S.user.uid,name:S.me.name,guest:false,card:S.me.card}); }

};

window.pickPhoto = inp => {
  const f = inp.files[0]; if(!f) return;
  const img = new Image(), r = new FileReader();
  r.onload = () => { img.onload = () => { const c=document.createElement('canvas'), z=200, sc=Math.max(z/img.width,z/img.height);
      c.width=c.height=z; const x=c.getContext('2d'); x.drawImage(img,(z-img.width*sc)/2,(z-img.height*sc)/2,img.width*sc,img.height*sc);
      cd('photo',c.toDataURL('image/jpeg',.75),1); }; img.src=r.result; };
  r.readAsDataURL(f);
};

  const card = {...S.draft, nick:(S.draft.nick||'').trim()||S.me.name.split(' ')[0], num:Math.max(1,Math.min(99,+S.draft.num||10))};
  S.me.card = card; await DB.setUser(S.user.uid,{card});

};

};
window.addGuest = async () => {
  const name = $('#f1').value.trim(); if(!name) return;
  const m = newGuest(name);
  await DB.setMember(S.league.id,m); lm().members.push(m); S.modal=null; render();
};

/* ---------- Admin: modifica totale di un giocatore ---------- */
function playerStatsOf(id){ return leagueStats(S.league.id)[id]; }
window.editPlayer = id => {
  const mem = lm().members.find(x=>x.id===id), st = playerStatsOf(id), c = mem.card;
  S.draft = {name:mem.name,nick:c.nick||'',pos:c.pos||'ATT',num:c.num||10,theme:c.theme||'gold',emoji:c.emoji||'⚽',photo:c.photo||'',
    wins:st.wins,draws:st.draws,losses:st.losses,goals:st.goals,assists:st.assists,ovr:st.ovr,ovrTouched:false};
  S.modal = {type:'editPlayer',id}; render();
};
function playerEditor(){
  const d = S.draft, l = S.league, mem = lm().members.find(x=>x.id===S.modal.id);
  const used = lm().matches.some(m=>[...m.A,...m.B].some(p=>p.id===mem.id));
  const nf = (k,lab) => `<div><label>${lab}</label><input type="number" inputmode="numeric" min="0" value="${esc(d[k])}" oninput="ed('${k}',this.value)"></div>`;
  const tot = ['wins','draws','losses'].reduce((t,k)=>t+(parseInt(d[k])||0),0);
  return `<h2>Modifica ${esc(mem.name)}</h2>
   <div class="demo">Da admin puoi cambiare tutto. I numeri qui sotto sono i <b>totali finali</b>: le partite future si sommeranno a questi.</div>
   <label>Nome</label><input value="${esc(d.name)}" oninput="ed('name',this.value)">
   <div class="row"><div><label>Soprannome</label><input maxlength="12" value="${esc(d.nick)}" oninput="ed('nick',this.value)"></div>
   <div><label>Ruolo</label><select onchange="ed('pos',this.value)">${POS.map(p=>`<option ${p===d.pos?'selected':''}>${p}</option>`).join('')}</select></div>
   <div><label>Numero</label><input type="number" min="1" max="99" value="${esc(d.num)}" oninput="ed('num',this.value)"></div></div>
   <h2>Statistiche</h2>
   <div class="row">${nf('wins','Vittorie')}${nf('draws','Pareggi')}${nf('losses','Sconfitte')}</div>
   <div class="row">${nf('goals','Gol')}${nf('assists','Assist')}<div><label>Overall (64-99)</label><input type="number" inputmode="numeric" min="64" max="99" value="${esc(d.ovr)}" oninput="ed('ovr',this.value);S.draft.ovrTouched=true"></div></div>
   <p class="mut">Partite totali: <b>${tot}</b> (vittorie + pareggi + sconfitte). Se non tocchi l'overall, si ricalcola da solo con le statistiche; se lo cambi, resta la tua correzione e continua ad aggiornarsi con le prossime partite.</p>
   <label>Colore carta</label><div class="chips">${Object.entries(THEMES).map(([k,t])=>`<div class="sw ${d.theme===k?'on':''}" style="background:${t.bg}" onclick="ed('theme','${k}',1)"></div>`).join('')}</div>
   <label>Icona</label><div class="chips">${EMOJIS.map(e=>`<div class="chip ${!d.photo&&d.emoji===e?'on':''}" onclick="ed('emoji','${e}',1)">${e}</div>`).join('')}</div>
   <button class="btn" onclick="savePlayer()">Salva modifiche</button>
   <button class="btn sec" onclick="resetPlayer()">↺ Ripristina calcolo automatico</button>
   ${mem.uid&&!l.admins.includes(mem.uid)?`<button class="btn sec" onclick="makeAdmin('${mem.uid}')">👑 Rendi admin</button>`:''}
   ${!mem.uid&&!used?`<button class="btn danger" onclick="delPlayer('${mem.id}')">🗑 Elimina giocatore</button>`:''}
   ${!mem.uid&&used?`<p class="mut">Per eliminare questo giocatore rimuovilo prima dalle partite in cui compare.</p>`:''}`;
}
window.ed = (k,v,re) => { S.draft[k]=v; if(k==='emoji') S.draft.photo=''; if(re) keepScroll(); };
window.savePlayer = async () => {
  const d = S.draft, lid = S.league.id, mem = lm().members.find(x=>x.id===S.modal.id), st = playerStatsOf(mem.id), b = st.base;
  const n = k => Math.max(0, parseInt(d[k])||0);
  const adj = {}; for(const k of ADJ) adj[k] = n(k) - (b[k]||0);
  const s = {wins:n('wins'),draws:n('draws'),losses:n('losses'),goals:n('goals'),assists:n('assists')}; s.played = s.wins+s.draws+s.losses;
  let ovrAdj = mem.ovrAdj||0;
  if(d.ovrTouched) ovrAdj = clampOv(parseInt(d.ovr)||OV_MIN) - calcOverall(s);
  const card = {...mem.card, nick:(d.nick||'').trim()||(d.name||mem.name).split(' ')[0], pos:d.pos, num:Math.max(1,Math.min(99,parseInt(d.num)||10)), theme:d.theme, emoji:d.emoji, photo:d.photo||''};
  try{ await DB.patchMember(lid,mem.id,{name:(d.name||'').trim()||mem.name,card,adj,ovrAdj}); }
  catch(e){ console.error(e); return toast('Salvataggio non riuscito'); }
  S.modal=null; S.draft=null; await refresh(lid); toast('Giocatore aggiornato ✅'); render();
};
window.resetPlayer = async () => {
  if(!confirm('Annullare tutte le correzioni manuali di statistiche e overall di questo giocatore?')) return;
  const lid = S.league.id, id = S.modal.id, adj = {}; for(const k of ADJ) adj[k]=0;
  await DB.patchMember(lid,id,{adj,ovrAdj:0}); S.modal=null; S.draft=null; await refresh(lid); toast('Ripristinato'); render();
};
window.delPlayer = async id => {
  if(!confirm('Eliminare definitivamente questo giocatore?')) return;
  const lid = S.league.id; await DB.delMember(lid,id); S.modal=null; S.draft=null; await refresh(lid); render();
};
window.makeAdmin = async u => {
  if(!confirm('Rendere admin questo giocatore? Potrà modificare tutto nella lega.')) return;
  const l = S.league; if(!l.admins.includes(u)) l.admins.push(u); await DB.saveLeague(l); S.modal=null; S.draft=null; await refresh(l.id); toast('Nuovo admin 👑'); render();
};

/* ---------- Admin: partite (anche vecchie) ---------- */
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; };
window.newMatch = () => { S.draft={id:uid()+uid(),date:todayStr(),time:'21:00',place:'',rows:{}}; S.modal={type:'match'}; render(); };
window.editMatch = id => {
  const m = lm().matches.find(x=>x.id===id), rows = {};
  m.A.forEach(p=>rows[p.id]={t:'A',g:p.g||0,a:p.a||0}); m.B.forEach(p=>rows[p.id]={t:'B',g:p.g||0,a:p.a||0});
  S.draft={id:m.id,date:m.date,time:m.time,place:m.place,rows}; S.modal={type:'match'}; render();
};
window.delMatch = async id => {
  if(!confirm('Eliminare la partita? Le statistiche verranno ricalcolate.')) return;
  const lid = S.league.id; await DB.delMatch(lid,id); await refresh(lid); toast('Partita eliminata'); render();
};
function matchForm(){
  const d = S.draft, mem = [...lm().members].sort((a,b)=>a.name.localeCompare(b.name));
  const sc = t => Object.values(d.rows).filter(r=>r.t===t).reduce((s,r)=>s+r.g,0);
  const cnt = t => Object.values(d.rows).filter(r=>r.t===t).length;
  return `<h2>${lm().matches.some(x=>x.id===d.id)?'Modifica partita':'Nuova partita'}</h2>
   <div class="row"><div><label>Giorno</label><input type="date" value="${d.date}" oninput="S.draft.date=this.value"></div><div><label>Ora</label><input type="time" value="${d.time}" oninput="S.draft.time=this.value"></div></div>
   <label>Luogo</label><input value="${esc(d.place)}" placeholder="Campo / centro sportivo" oninput="S.draft.place=this.value">
   <div class="box" style="text-align:center"><span class="mut">A (${cnt('A')})</span> <b style="font-size:26px">${sc('A')} - ${sc('B')}</b> <span class="mut">(${cnt('B')}) B</span><div class="mut">Il risultato è la somma dei gol inseriti</div></div>
   <label>Formazioni e statistiche</label>
   ${mem.map(m=>{ const r=d.rows[m.id]||{t:'',g:0,a:0};
     return `<div class="pick"><b style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(m.name)}${m.uid?'':' <span class="mut">(no account)</span>'}</b>
     <div class="tg"><button class="${r.t==='A'?'on a':''}" onclick="setT('${m.id}','A')">A</button><button class="${r.t==='B'?'on b':''}" onclick="setT('${m.id}','B')">B</button></div>
     ${r.t?`<div class="st">⚽<button onclick="stp('${m.id}','g',-1)">−</button><span>${r.g}</span><button onclick="stp('${m.id}','g',1)">+</button></div>
     <div class="st">🎯<button onclick="stp('${m.id}','a',-1)">−</button><span>${r.a}</span><button onclick="stp('${m.id}','a',1)">+</button></div>`:'<span></span><span></span>'}</div>`}).join('')}
   <br><button class="btn sec" onclick="quickGuest()">+ Nuovo giocatore senza account</button>
   <button class="btn" onclick="saveMatch()">Salva partita</button>`;
}
window.S = S;
window.setT = (id,t) => { const r=S.draft.rows[id]; if(r&&r.t===t) delete S.draft.rows[id]; else S.draft.rows[id]={t,g:r?r.g:0,a:r?r.a:0}; keepScroll(); };
window.stp = (id,k,v) => { const r=S.draft.rows[id]; r[k]=Math.max(0,r[k]+v); keepScroll(); };
window.quickGuest = async () => {
  const name = (prompt('Nome del giocatore (senza account):')||'').trim(); if(!name) return;
  const m = newGuest(name); await DB.setMember(S.league.id,m); lm().members.push(m); keepScroll();
};
function keepScroll(){ const m=document.querySelector('.modal>div'), y=m?m.scrollTop:0; render(); const n=document.querySelector('.modal>div'); if(n) n.scrollTop=y; }
window.saveMatch = async () => {
  const d = S.draft, A=[], B=[];
  for(const [id,r] of Object.entries(d.rows)) (r.t==='A'?A:B).push({id,g:r.g,a:r.a});
  if(!d.date||!d.time) return toast('Inserisci giorno e ora');
  if(!A.length||!B.length) return toast('Servono giocatori in entrambe le squadre');
  const prev = lm().matches.find(x=>x.id===d.id), ids = new Set([...A,...B].map(p=>p.id));
  const obj = {id:d.id,date:d.date,time:d.time,place:d.place.trim(),A,B,ts:Date.now()};
  if(prev && prev.report) obj.report = {...prev.report, ratings:Object.fromEntries(Object.entries(prev.report.ratings||{}).filter(([id])=>ids.has(id)))};
  await DB.saveMatch(S.league.id,obj);
  const lid = S.league.id; S.modal=null; S.draft=null; await refresh(lid);
  if(!prev){ toast('Partita salvata ✅ Ora scrivi il resoconto'); openReport(d.id); }
  else { toast('Partita salvata, statistiche aggiornate ✅'); render(); }
};

/* ---------- Bacheca: resoconto ufficiale con voti e commenti (solo admin) ---------- */
window.openReport = mid => {
  const m = lm().matches.find(x=>x.id===mid), r = m.report, ratings = {};
  for(const p of [...m.A,...m.B]){ const x = r&&r.ratings&&r.ratings[p.id]; ratings[p.id] = {v:x&&typeof x.v==='number'?x.v:null, c:x?x.c||'':''}; }
  S.draft = {mid,text:r?r.text||'':'',ratings}; S.modal = {type:'report',mid}; render();
};
function reportForm(){
  const m = lm().matches.find(x=>x.id===S.modal.mid), d = S.draft, mem = lm().members, [a,b] = scoreOf(m);
  const row = p => { const x = mem.find(y=>y.id===p.id); if(!x) return ''; const r = d.ratings[p.id];
    return `<div class="rp"><div class="top"><b>${esc(x.name)}</b><div class="stv"><button onclick="rv('${p.id}',-1)">−</button><span>${r.v==null?'–':fmtV(r.v)}</span><button onclick="rv('${p.id}',1)">+</button></div></div>
      <input placeholder="Commento su ${esc(dispName(x))}…" value="${esc(r.c)}" oninput="S.draft.ratings['${p.id}'].c=this.value"></div>`; };
  return `<h2>${m.report?'Modifica resoconto':'Resoconto della partita'}</h2>
   <p class="mut">${new Date(m.date+'T12:00').toLocaleDateString('it-IT',{day:'numeric',month:'long',year:'numeric'})} · ${a} - ${b}</p>
   <label>Com'è andata</label><textarea placeholder="Racconta la partita…" oninput="S.draft.text=this.value">${esc(d.text)}</textarea>
   <label>Voti e commenti · Squadra A</label>${m.A.map(row).join('')}
   <label style="display:block;margin-top:14px">Voti e commenti · Squadra B</label>${m.B.map(row).join('')}
   <p class="mut">Voti da 1 a 10 (passo 0,5): entrano nella media voto di ogni giocatore. Un giocatore può restare senza voto.</p>
   <button class="btn" onclick="saveReport()">📣 Pubblica in bacheca</button>`;
}
window.rv = (id,dir) => { const r = S.draft.ratings[id]; r.v = r.v==null ? 6 : (dir>0 ? Math.min(10,r.v+0.5) : (r.v<=1 ? null : r.v-0.5)); keepScroll(); };
window.saveReport = async () => {
  const lid = S.league.id, m = lm().matches.find(x=>x.id===S.modal.mid), d = S.draft, ratings = {};
  for(const [id,r] of Object.entries(d.ratings)){ const c=(r.c||'').trim(); if(r.v!=null||c) ratings[id] = {v:r.v==null?null:r.v, c}; }
  const text = (d.text||'').trim();
  if(!text && !Object.keys(ratings).length) return toast('Scrivi il resoconto o dai almeno un voto');
  const old = m.report||{}, report = {text,ratings,ts:old.ts||Date.now(),by:old.by||S.user.uid,byName:old.byName||S.me.name};
  try{ await DB.saveMatch(lid,{...m,report}); }catch(e){ console.error(e); return toast('Pubblicazione non riuscita'); }
  S.modal=null; S.draft=null; await refresh(lid); S.ltab='board'; toast('Resoconto pubblicato 📣'); render();
};
window.delReport = async mid => {
  if(!confirm('Eliminare il resoconto (testo, voti e commenti)?')) return;
  const lid = S.league.id, m = lm().matches.find(x=>x.id===mid), {report,...rest} = m;
  await DB.saveMatch(lid,rest); await refresh(lid); toast('Resoconto eliminato'); render();
};

/* ---------- Calendario dei voti ---------- */
function ratingEntries(refs){
  const out = [];
  for(const {lid,mid} of refs){ const lg = S.leagues.find(l=>l.id===lid);
    for(const m of S.cache[lid].matches){
      const team = m.A.some(p=>p.id===mid)?'A':m.B.some(p=>p.id===mid)?'B':null; if(!team) continue;
      const [a,b] = scoreOf(m), my = team==='A'?a:b, op = team==='A'?b:a, x = m.report&&m.report.ratings&&m.report.ratings[mid];
      out.push({date:m.date,time:m.time,v:x&&typeof x.v==='number'?x.v:null,c:x?x.c||'':'',lg:lg?lg.name:'',score:`${a}-${b}`,res:my>op?'Vittoria':my===op?'Pareggio':'Sconfitta',team,place:m.place||'',mvp:mvpIds(m).includes(mid)});
    } }
  return out.sort((x,y)=>(x.date+x.time).localeCompare(y.date+y.time));
}
window.openCal = who => {
  let refs, title;
  if(who==='me'){ refs = S.leagues.map(l=>({lid:l.id,mid:(myMember(l.id)||{}).id})).filter(r=>r.mid); title = 'I miei voti'; }
  else { refs = [{lid:S.league.id,mid:who}]; title = 'Voti di '+dispName(lm().members.find(x=>x.id===who)); }
  const entries = ratingEntries(refs), last = entries.length?entries[entries.length-1].date:todayStr(), [y,mo] = last.split('-').map(Number);
  S.modal = {type:'cal',entries,ym:{y,mo:mo-1},sel:null,prev:S.modal,title}; render();
};
window.calBack = () => { S.modal = S.modal.prev; render(); };
window.calSel = k => { S.modal.sel = S.modal.sel===k ? null : k; keepScroll(); };
window.calNav = d => { let {y,mo} = S.modal.ym; mo+=d; if(mo<0){mo=11;y--} if(mo>11){mo=0;y++} S.modal.ym={y,mo}; S.modal.sel=null; keepScroll(); };
function calView(){
  const m = S.modal, {y,mo} = m.ym, byDay = {};
  m.entries.forEach(e=>(byDay[e.date]=byDay[e.date]||[]).push(e));
  const avgOf = a => a.length ? a.reduce((p,q)=>p+q,0)/a.length : null;
  const vs = m.entries.filter(e=>e.v!=null).map(e=>e.v), avg = avgOf(vs);
  const start = (new Date(y,mo,1).getDay()+6)%7, days = new Date(y,mo+1,0).getDate();
  let cells = ['L','M','M','G','V','S','D'].map(x=>`<div class="dw">${x}</div>`).join('');
  for(let i=0;i<start;i++) cells += '<div class="cd empty"></div>';
  for(let d=1;d<=days;d++){
    const key = `${y}-${String(mo+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`, es = byDay[key];
    let inner = `<span class="dn">${d}</span>`;
    if(es){ const a = avgOf(es.filter(e=>e.v!=null).map(e=>e.v)); inner += a==null ? '<span class="cv v-no">–</span>' : `<span class="cv v-${vClass(a)}">${fmtV(a)}</span>`; if(es.some(e=>e.mvp)) inner += '<span class="mv">🏅</span>'; }
    cells += `<div class="cd${es?' has':''}${m.sel===key?' sel':''}"${es?` onclick="calSel('${key}')"`:''}>${inner}</div>`;
  }
  const det = (byDay[m.sel]||[]).map(e=>`<div class="box"><b>${e.v==null?'Nessun voto':'Voto '+fmtV(e.v)}</b>${e.mvp?' · 🏅 MVP':''} · ${e.res} ${e.score}<div class="mut">${esc(e.lg)}${e.place?' · '+esc(e.place):''} · Squadra ${e.team}</div>${e.c?`<div style="margin-top:6px">“${esc(e.c)}”</div>`:''}</div>`).join('');
  return `<h2>${esc(m.title)}</h2>
   <div class="grid" style="grid-template-columns:repeat(4,1fr)"><div class="stat"><b>${avg==null?'–':f1(avg)}</b><span>Media</span></div><div class="stat"><b>${vs.length}</b><span>Voti</span></div><div class="stat"><b>${vs.length?fmtV(Math.max(...vs)):'–'}</b><span>Migliore</span></div><div class="stat"><b>🏅 ${m.entries.filter(e=>e.mvp).length}</b><span>MVP</span></div></div>
   <div class="calh"><button onclick="calNav(-1)">‹</button><b>${new Date(y,mo,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</b><button onclick="calNav(1)">›</button></div>
   <div class="cal">${cells}</div>
   <p class="mut">${m.entries.length?'Sotto il giorno di ogni calcetto c\'è il voto preso. Tocca un giorno per leggere il commento.':'Nessun calcetto giocato finora.'}</p>${det}`;
}

boot();
</script>
